name: next-ci

on:
  push:
    # claude/**: work branches are checked before they reach main, not after
    branches: [main, master, "claude/**"]
    paths: ["next/**", ".github/workflows/next-ci.yml"]
  pull_request:
    paths: ["next/**", ".github/workflows/next-ci.yml"]
  workflow_dispatch:

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # must match "builtin-baseline" in next/vcpkg.json
  VCPKG_COMMIT: 3855d4d6b52353ee2e2f73044327e59d01a18c84
  GODOT_VERSION: 4.7.2

jobs:
  cpp:
    name: C++ ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows x64 MSVC", os: windows-latest, preset: windows-msvc }
          - { name: "Linux x64 GCC",    os: ubuntu-24.04,   preset: linux-gcc }
    defaults:
      run:
        working-directory: next
        shell: bash
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Create vcpkg binary cache directory
        run: cmake -E make_directory "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('next/vcpkg.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-bin-${{ runner.os }}-
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgJsonGlob: "next/vcpkg.json"
      # MSVC's headers include each other generously, libstdc++'s do not: a missing <cstdint> only
      # shows on Linux.  This finds it in a second, on every platform, before the long build.
      - name: Pick the python of this runner
        run: if [ "$RUNNER_OS" = "Windows" ]; then echo "PY=python" >> "$GITHUB_ENV"; else echo "PY=python3" >> "$GITHUB_ENV"; fi
      - name: Standard headers are included where they are used
        run: $PY tools/check_includes.py
      # the console of jx_zone and the gateway speaks Vietnamese through config/log.vi.json:
      # a new log line has to come with its sentence
      - name: Every log message has its sentence in the console catalogue
        run: $PY tools/check_log_catalog.py
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build (Debug)
        run: cmake --build --preset ${{ matrix.preset }}-debug
      # A failed ctest says "exit code 8" and nothing else; ci_annotate.py runs the failed tests again
      # and turns each failing REQUIRE into an annotation on the run's summary (readable without the log).
      - name: Test (Debug)
        run: ctest --preset ${{ matrix.preset }}-debug || $PY tools/ci_annotate.py ${{ matrix.preset }}-debug
      - name: Build (Release)
        run: cmake --build --preset ${{ matrix.preset }}-release
      - name: Test (Release)
        run: ctest --preset ${{ matrix.preset }}-release || $PY tools/ci_annotate.py ${{ matrix.preset }}-release
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-cpp-${{ matrix.preset }}-logs
          path: |
            next/build/**/CMakeFiles/CMakeConfigureLog.yaml
            next/build/**/Testing/Temporary/LastTest.log
            next/build/**/vcpkg-manifest-install.log
          if-no-files-found: ignore

  go:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: next/services
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: next/services/go.mod
          cache-dependency-path: next/services/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: fuzz the frame codec (Linux)
        if: runner.os == 'Linux'
        run: |
          go test ./pkg/frame -run XXX -fuzz FuzzParser -fuzztime 30s
          go test ./pkg/frame -run XXX -fuzz FuzzReader -fuzztime 15s
      - name: go build
        run: go build -o ../build/go/ ./cmd/...

  client:
    name: Godot client (headless)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: next
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "JX_GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      # A block scalar on purpose.  `run: "$JX_GODOT" --headless ...` is not YAML (a quoted scalar
      # cannot be followed by more text), and one such line made the WHOLE workflow invalid: from
      # M5d to U5 GitHub reported every push as failed without running a single job.
      - name: Client unit tests
        run: |
          "$JX_GODOT" --headless --path client -s tests/run.gd
      - name: Login windows rebuilt from the exported layouts (skips itself without assets/ui)
        run: |
          "$JX_GODOT" --headless --path client tests/UiCheck.tscn

  e2e:
    name: End to end (Linux)
    runs-on: ubuntu-24.04
    needs: [go, client]
    defaults:
      run:
        working-directory: next
        shell: bash
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
      JX_PRESET: linux-gcc
      JX_CONFIG: Release
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: next/services/go.mod
          cache-dependency-path: next/services/go.sum
      - name: Create vcpkg binary cache directory
        run: cmake -E make_directory "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('next/vcpkg.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-bin-${{ runner.os }}-
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgJsonGlob: "next/vcpkg.json"
      - name: Build zone (Release)
        run: |
          cmake --preset linux-gcc -DJX_BUILD_TESTS=OFF
          cmake --build --preset linux-gcc-release --target jx_zone
      - name: Build Go binaries
        run: go build -o ../build/go/ ./cmd/...
        working-directory: next/services
      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "JX_GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: zone + gateway + bot + Godot client
        run: python3 tools/dev.py e2e
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-e2e-logs
          path: |
            next/logs/*.log
            next/data/**
          if-no-files-found: ignore
