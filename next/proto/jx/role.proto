// Persistent character data ("RoleData").  This is the model every layer agrees on:
// persist stores it, the zone loads/saves it, the client receives a projection of it.
// Add fields freely; never renumber or reuse a tag.
syntax = "proto3";
package jx.pb;
option go_package = "github.com/JXGAME04/DUANGODOT/next/services/pkg/jxpb";

import "jx/common.proto";

message RolePosition {
  uint32 zone_id = 1;   // logical zone id
  Vec2 pos = 2;
  uint32 map_id = 3;    // map bundle within the zone (0 = the zone's default map)
}

// The character's own numbers, the way TRoleData of the JX2 server keeps them (KPlayer::LoadFrom,
// docs/LINUX-SERVER.md §10): hp_max / mp_max are the BASE maxima (m_LifeMax / m_ManaMax: levels
// and attribute points, before equipment); stamina_max is recomputed from the level tables; the
// five points are the base points (m_nStrength.. the player put there), the current ones are
// derived every time the zone recalculates.
message RoleStats {
  int32 hp = 1;
  int32 hp_max = 2;
  int32 mp = 3;
  int32 mp_max = 4;
  int32 stamina = 5;
  int32 stamina_max = 6;
  int32 strength = 7;
  int32 dexterity = 8;
  int32 vitality = 9;
  int32 energy = 10;
  int32 move_speed = 11;    // units per second
  int32 lucky = 12;         // m_nLucky
  int32 attribute_point = 13;   // m_nAttributePoint: unspent (5 per level)
  int32 skill_point = 14;       // m_nSkillPoint: unspent (1 per level)
  uint32 reborn = 15;       // times reborn (KPlayer+0x86b8, <= 7): picks the experience table
  uint32 camp = 16;         // m_Camp (BaseInfo.iteam)
}

// One attribute of an item (KMagicAttrib of the old core): a type and up to three parameters.
message ItemMagic {
  uint32 type = 1;
  repeated int32 value = 2;   // 3 values
}

// One item a character holds (KItem + its place in KItemList; docs/OLD-TO-NEW.md).  What made
// the item is kept (version, genre/detail/particular/level, gen_param) so its table row can be
// found again, and what was rolled for it (base attributes, magic) so it never re-rolls.
message ItemData {
  uint32 id = 1;              // unique within the character, never reused
  uint32 version = 2;         // the item table set it was made from (settings/item/000..)
  uint32 genre = 3;           // ITEMGENRE
  uint32 detail = 4;
  uint32 particular = 5;
  uint32 level = 6;
  int32 series = 7;           // -1 = none
  uint32 count = 8;           // stack
  int32 durability = 9;       // -1 = never wears
  uint32 ex_type = 10;        // 0 normal, 1 gold, 2 platina, 3 purple
  uint32 gen_param = 11;      // gold: row id; script item: row
  uint32 group = 12;          // gold: the set
  uint32 ex_group = 13;
  uint32 group_serial = 14;
  repeated ItemMagic base = 15;
  repeated ItemMagic require = 16;
  repeated ItemMagic magic = 17;
  repeated ItemMagic magic_ex = 18;
  uint32 room = 19;           // KItemRoom: 0 bag, 1 repository, 2 trade, 3 quick slots, 10 worn (x = part)
  uint32 x = 20;
  uint32 y = 21;
  uint32 rand_seed = 22;      // KItem+0x1e0: the seed of the roll (ITEM_GetItemRandSeed; AddItemEx with a seed rolls the same piece again)
  repeated int32 magic_level = 23;   // KItem+0x1e4..: the six levels of the roll (SetItemMagicLevel writes one)
  uint32 luck = 24;           // KItem+0x200: the luck of the roll (GetItemProp)
}

// One skill of the character's KSkillList (jx_linux_y 0x080E48D0 writes {int16 id, int16 level,
// int32 exp}, KPlayer::LoadPlayerFightSkillList 0x080C0240 reads it back through KSkillList::Add);
// cells that live on increments only are not saved.
message RoleSkill {
  uint32 id = 1;
  uint32 level = 2;
  uint32 exp = 3;
}

// One saved task value of the character (KPlayerTask of the old core, the std::map at Player+0x809c+0x54c of jx_linux_y;
// KPlayer::SavePlayerTaskList 0x080BF1C0 writes the non-zero {int id, int value} pairs into TRoleData, LoadPlayerTaskList
// 0x080C0050 reads them back through SetSaveVal).  The temp values (m_nTaskTemp) are never saved.
message RoleTaskValue {
  uint32 id = 1;              // 0..0x176f
  int32 value = 2;            // never 0 (a 0 erases the entry)
}

// One event a script registered on the character (KPlayerEvent, Player+0x8064 of jx_linux_y: {word id, word count};
// the extra block of TRoleData keeps them, 0x080BEB60): AddPlayerEvent, counted by the kills of event_killnpc.txt
message RolePlayerEvent {
  uint32 id = 1;
  uint32 count = 2;           // the kills so far
}

message RoleData {
  uint64 player_id = 1;
  uint64 account_id = 2;
  string name = 3;          // UTF-8, validated by the auth/persist layer
  uint32 level = 4;
  uint64 exp = 5;
  uint32 series = 6;        // five elements (metal, wood, water, fire, earth) as in the old game
  uint32 sex = 7;
  int32 faction = 8;        // KPlayerFaction::m_nCurFaction (KPlayer+0x59cc; cFaction of the DB record): 0..10, -1 = none
  RolePosition position = 9;
  RoleStats stats = 10;
  repeated ItemData items = 11;   // (RoleItem, the placeholder that stood here, was never written by anyone)
  uint64 created_at_ms = 12;
  uint64 last_login_ms = 13;
  uint64 play_time_s = 14;
  // Shape of this record.  persist.CurrentRoleVersion is what the running server writes; an
  // older record is upgraded on load (persist.MigrateRole), a newer one is refused instead of
  // being silently downgraded.  See docs/ADR-003-role-data.md.
  uint32 data_version = 15;
  bool fight_mode = 16;     // KNpc::SetFightMode: in/out of combat stance (city gate traps)
  // Where the character was born (CharCreateReq.native_place, KRoleChiefInfo.NativePlaceId of the
  // old game): the map id of the starting village, the character's home for the revive rules.
  uint32 native_place = 17;
  uint32 next_item_id = 18;  // KItemList: the id the next item gets (ids never repeat within a character)
  uint32 money = 19;         // in the bag (KItemList room_equipment money)
  uint32 bank_money = 20;    // in the repository
  repeated RoleSkill skills = 21;   // the fight skill list (KSkillList; DBSkillData of the old server)
  // the revive point (KPlayer+0x20 map, +0x28 / +0x2c x, y: SetTempRevPos / SetRevPos): where KPlayer::Revive(0) puts
  // the character back; 0 = the spawn point of its map
  uint32 revive_map = 22;
  Vec2 revive_pos = 23;
  // the id of the revive point (KPlayer+0x14: the Bishop's irevivalx of a fresh character = one of its village's ids in
  // revivepos.ini, or SetRevPos(map, ref) later); the zone resolves it through revive_pos.json; 0 = none
  uint32 revive_ref = 24;
  // KPlayerFaction (Core/Src/KPlayerFaction.h; KPlayer+0x59cc..+0x59d8 of jx_linux_y): the faction last added (m_nLastAddFaction,
  // +0x59d4, the one the client's skill book shows the branches of) and how many times a faction was joined (m_nAddTimes,
  // +0x59d8: 0 = never, the name of a character without faction depends on it); m_nFirstAddFaction is not saved (LoadFrom 0x080C1A62)
  int32 faction_last = 25;
  uint32 faction_count = 26;
  // KPlayerPK (Player+0x5a50): the PK state 0..2 (the save 0x080BFCDD writes the byte), the PK value 0..10 (0x080BFCEF), the
  // ForbidChangePK lock
  uint32 pk_state = 27;
  uint32 pk_value = 28;
  bool pk_locked = 29;
  // the leadership (m_dwLeadExp +0x596c / m_dwLeadLevel +0x5970 of KPlayer): the level says how many a team led by the
  // character can hold (level_lead_exp.txt col 3, KTeam::CalcCaptainPower 0x080CC960); 0 = level 1
  uint64 lead_exp = 30;
  uint32 lead_level = 31;
  repeated RoleTaskValue task_values = 32;   // the task values the scripts keep (GetTask / SetTask; docs/LINUX-SERVER.md §21)
  repeated RolePlayerEvent events = 33;      // the kill events registered on the character (AddPlayerEvent; docs/LINUX-SERVER.md §23)
}
