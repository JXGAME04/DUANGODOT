// Shared scalar types.  Package jx.pb is used by every file so the three generators
// (C++ jx::pb, Go jxpb, GDScript) see one namespace.
syntax = "proto3";
package jx.pb;
option go_package = "github.com/JXGAME04/DUANGODOT/next/services/pkg/jxpb";

// World position in integer units (old game: 1 cell = 32 units, one map ~ 10k x 10k units).
message Vec2 {
  int32 x = 1;
  int32 y = 2;
}

enum Result {
  RESULT_OK = 0;
  RESULT_INTERNAL_ERROR = 1;
  RESULT_BAD_REQUEST = 2;
  RESULT_UNAUTHORIZED = 3;
  RESULT_NOT_FOUND = 4;
  RESULT_ALREADY_EXISTS = 5;
  RESULT_FULL = 6;
  RESULT_INVALID_NAME = 7;
  RESULT_WRONG_STATE = 8;
  RESULT_ZONE_UNAVAILABLE = 9;
  RESULT_VERSION_MISMATCH = 10;
  // login results of the old Sword3PaySys / Bishop (LoginDef.h LOGIN_R_*, S3PAccount::Login)
  RESULT_ACCOUNT_IN_USE = 11;    // LOGIN_R_ACCOUNT_EXIST: the account is logged in elsewhere
  RESULT_ACCOUNT_FROZEN = 12;    // LOGIN_R_FREEZE: frozen by a GM
  RESULT_NO_GAME_TIME = 13;      // LOGIN_R_TIMEOUT / E_ACCOUNT_NODEPOSIT: no game time left
  RESULT_SERVER_BUSY = 14;       // LOGIN_R_FAILED: too many failed logins, try again later
  // session protection (new in JX NEXT)
  RESULT_RATE_LIMITED = 15;      // the client sent more than the gateway allows
  RESULT_TIMEOUT = 16;           // no heartbeat within the allowed time
  RESULT_REPLACED = 17;          // LOGIN_R_BEDISCONNECTED: the account logged in from elsewhere
  RESULT_SERVER_SHUTDOWN = 18;   // LL_R_SERVER_SHUTDOWN: the gateway is going down
}

enum EntityType {
  ENTITY_UNKNOWN = 0;
  ENTITY_PLAYER = 1;
  ENTITY_NPC = 2;
  ENTITY_MONSTER = 3;
  ENTITY_DROP = 4;
}
