// Client <-> gateway messages.  C2G = client to gateway, G2C = gateway to client.
// Some C2G messages are forwarded unchanged to the zone (see MsgId comments in msg.proto).
syntax = "proto3";
package jx.pb;
option go_package = "github.com/JXGAME04/DUANGODOT/next/services/pkg/jxpb";

import "jx/common.proto";
import "jx/role.proto";

// ---- handshake / auth ------------------------------------------------------------------

message Hello {
  uint32 protocol_version = 1;   // PROTOCOL_VERSION in msg.proto
  string client_version = 2;
  string platform = 3;           // "windows", "linux", "android", ...
  string device_id = 4;
}

message HelloAck {
  uint32 protocol_version = 1;
  uint64 server_time_ms = 2;
  string server_version = 3;
  uint64 sid = 4;                // session id, useful when reading logs
  string auth_mode = 5;          // "dev" (first login registers the account) or "strict" (registered accounts only)
  uint32 heartbeat_s = 6;        // the gateway drops a silent in-world session after this many seconds; ping more often
}

message LoginReq {
  string account = 1;
  string password = 2;           // dev auth only; real auth uses tokens (phase 3)
}

message LoginRes {
  Result result = 1;
  uint64 account_id = 2;
  string text = 3;               // human readable reason (field names must avoid protobuf keywords: godobuf)
}

// ---- characters ------------------------------------------------------------------------

message CharSummary {
  uint64 player_id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 series = 4;
  uint32 sex = 5;
  int32 faction = 6;          // KPlayerFaction::m_nCurFaction: 0..10, -1 = none
  uint32 zone_id = 7;
}

message CharListReq {}

message CharListRes {
  Result result = 1;
  repeated CharSummary chars = 2;
  uint32 max_chars = 3;
}

message CharCreateReq {
  string name = 1;
  uint32 series = 2;
  uint32 sex = 3;
  // The starting village the player picked (KUiSelNativePlace): the Id of Settings/NativePlaceList.ini,
  // which is the map id of the village (53 Ba Lang Huyen, 20 Giang Tan Thon...).  0 = not chosen.
  uint32 native_place = 4;
}

message CharCreateRes {
  Result result = 1;
  CharSummary summary = 2;
}

message EnterWorldReq {
  uint64 player_id = 1;
}

message EnterWorldRes {
  Result result = 1;
  uint32 zone_id = 2;
  string zone_name = 3;
  uint64 entity_id = 4;          // the entity that belongs to this client in the zone
  Vec2 pos = 5;
  uint32 tick_hz = 6;
  uint32 map_id = 7;             // which map bundle to draw (0 = plain grid)
  uint32 scene_w = 8;
  uint32 scene_h = 9;
}

message LeaveWorldReq {}

// ---- world (zone) ----------------------------------------------------------------------

// Server authoritative movement: the client asks to move towards a target, the zone
// simulates and broadcasts EntityMove to everyone who can see the entity.
message MoveReq {
  Vec2 target = 1;
  uint32 seq = 2;                // client sequence number, echoed in EntityMove for the own entity
}

// Basic melee attack on a target (KNpc::DoAttack).  The zone repeats the swing until the target
// dies, the player moves or the target leaves reach.
message AttackReq {
  uint64 target = 1;
  uint32 seq = 2;
}

// KNpc::m_Doing as far as clients need it.
enum Action {
  ACTION_STAND = 0;
  ACTION_ATTACK = 1;             // frames = swing length in logic frames (18 Hz), dir = facing, target
  ACTION_HURT = 2;               // frames = hurt length (KNpc::DoHurt), pos = where the entity stands
  ACTION_DEATH = 3;              // frames = death animation; the corpse keeps the last frame until despawn
  ACTION_REVIVE = 4;
  ACTION_JUMP = 5;               // a jump of a style-1 skill (the 0x54 packet of KNpc 0x0807B320): aim = where it lands, frames = the frames in the air
  ACTION_KNOCK_BACK = 6;         // KNpc::KnockBack 0x08087940 -> SendSyncAction 0x0807A970 (the 0x56 packet, doing 0x18): aim = the spot pushed to, frames = the frames of the push, target = who pushed
  ACTION_SIT = 7;                // KNpc::DoSit 0x0807B550 (the 0x83 packet {npc id} around, the 0x9f {6, 1} to oneself): m_Doing 8, frames = m_SitFrame 15 - the last frame is held (0x08087880)
}

// An entity started an action (old NPC_HURT_SYNC / NPC_DEATH_SYNC / skill sync).
message EntityAction {
  uint64 entity_id = 1;
  Action action = 2;
  uint64 target = 3;
  uint32 dir = 4;
  uint32 frames = 5;
  Vec2 pos = 6;
  uint64 tick = 7;
  uint32 skill_id = 8;           // ACTION_ATTACK: the skill cast (the 0x5a packet of KNpc::CastSkill), 0 = a plain swing
  uint32 skill_level = 9;
  Vec2 aim = 10;                 // the spot aimed at when target is 0
}

// Life changed (damage / heal), sent to everyone who sees the entity.
message EntityLife {
  uint64 entity_id = 1;
  uint32 life = 2;
  uint32 life_max = 3;
  int32 delta = 4;               // negative = damage
  uint64 source = 5;
}

message EntityInfo {
  uint64 entity_id = 1;
  EntityType entity_type = 2;
  string name = 3;
  Vec2 pos = 4;
  Vec2 target = 5;               // where it is currently moving to (== pos when idle)
  uint32 move_speed = 6;
  uint32 level = 7;
  uint32 series = 8;
  uint32 sex = 9;
  uint32 template_id = 10;       // npc/monster template, 0 for players
  repeated Vec2 path = 11;       // remaining waypoints after pos (server pathfinding)
  uint32 dir = 12;               // facing direction 0..63 (old g_GetDirIndex: 0 = down, clockwise on screen)
  uint32 life = 13;
  uint32 life_max = 14;
  Action doing = 15;             // what it is doing right now (a corpse reports ACTION_DEATH)
  uint32 doing_frames = 16;
  uint32 count = 17;             // ENTITY_DROP: the stack of the item, or the coins of a money pile (template_id = ObjData row)
  int32 hide = 18;               // > 0: hidden ([hide] 200 of a state) - only its own client is sent it then (the hide bit of the old 0x4d status packet)
  bool riding = 19;              // on its horse (KNpc+0x199c, the 0x20 flag of the 0x4c / 0x4d packets)
  uint32 gold_type = 20;         // the gold word of the 0x4c packet (0x0807FCA5): KNpcGold::GetGoldKind = the NpcGoldTemplate row + 1 while gold, 0 plain; a boss
                                 // (+0x181c != 0) carries the table's count + 1 - the 2.0 client colours the name by it (0x005F23E5: 0xFF6365FF, above its table 0xFFEBB200)
  int32 camp = 21;               // m_Camp +0x21c (the byte +0xb of the 0x4c packet -> the client's KNpc+0xf4)
  int32 current_camp = 22;       // m_CurrentCamp +0x220 (the byte +3 -> KNpc+0xf8): the colour of a player's name (0x005F2507, the table 0x5f2d94)
  // +0x14dc..+0x14ec of the 0x4a / 0x4b player sync (0x0807BF86, 0x080813BD): the equipment rows of the main characters'
  // part tables the client dresses a player in (KNpc+0x13f0 helm, +0x13f4 armour, +0x1400 weapon, +0x13fc horse, +0x13f8 mantle)
  int32 helm_res = 23;
  int32 armor_res = 24;
  int32 weapon_res = 25;
  int32 horse_res = 26;          // -1 = no horse (HorseRes level 0)
  int32 mantle_res = 27;         // -1 = none
}

message EntityRes {              // G2C_ENTITY_RES: the 0xad packet (0x0807A9D0) - a player's look changed (a piece put on / taken off)
  uint64 entity_id = 1;
  int32 helm_res = 2;
  int32 armor_res = 3;
  int32 weapon_res = 4;
  int32 horse_res = 5;
  int32 mantle_res = 6;
  uint32 version = 7;            // +0x1504 (the client keeps it in KNpc+0x1408 and asks for a full sync when a 0x4b disagrees)
}

message NpcGold {                // G2C_NPC_GOLD: the 0x9a packet {0x9a, npc id, word kind} of SetGoldTypeAndBackData 0x0809DF66 - a monster turned gold (the 2.0 handler 0x00653110)
  uint64 entity_id = 1;
  uint32 gold_type = 2;          // as EntityInfo.gold_type
}

message EntityRide {             // G2C_ENTITY_RIDE: a npc mounted or dismounted (the flag of the next 0x4c / 0x4d sync in the old game)
  uint64 entity_id = 1;
  bool riding = 2;
}

message PickUpReq {              // C2G_PICK_UP: take the thing on the ground into the bag (KPlayer::ServerPickUpItem)
  uint64 entity_id = 1;
  uint32 seq = 2;                // answered with G2C_ITEM_ADD / G2C_MONEY, or G2C_ITEM_RESULT with the reason
}

message EntitySpawn {
  repeated EntityInfo entities = 1;
}

message EntityDespawn {
  repeated uint64 entity_ids = 1;
}

message EntityMove {
  uint64 entity_id = 1;
  Vec2 pos = 2;                  // position at tick
  Vec2 target = 3;               // final destination (last waypoint), == pos when idle
  uint32 move_speed = 4;
  uint64 tick = 5;
  uint32 seq = 6;                // MoveReq.seq when this is the receiver own entity
  repeated Vec2 path = 7;        // waypoints from pos to target; the client follows the same line
}

// The movements of entities FAR from the receiver, gathered over a few ticks into one frame
// (KSubWorld::flush_far, N3).  Each entry is the entity's latest state, exactly what an EntityMove
// would carry; the client handles them one by one.  What moves near the receiver still comes as a
// single EntityMove the moment it happens.
message EntityMoves {
  repeated EntityMove moves = 1;
}

message ChatReq {
  string text = 1;
}

// ---- items (M11) ----

// One item as the client sees it: what the character holds (KItem) plus what its table row says
// (name, picture, size, price) so the bag window needs no table of its own.
message ItemView {
  uint32 id = 1;
  uint32 genre = 2;              // ITEMGENRE: 0 equipment, 1 medicine, 4 quest, 5 town portal, 6 script item
  uint32 detail = 3;
  uint32 particular = 4;
  uint32 level = 5;
  int32 series = 6;
  uint32 count = 7;
  int32 durability = 8;          // -1 = never wears
  int32 max_durability = 9;
  uint32 ex_type = 10;           // 0 normal, 1 gold, 2 platina, 3 purple
  uint32 room = 11;              // 0 bag, 1 repository, 2 trade, 3 quick slots, 10 worn (x = part)
  uint32 x = 12;
  uint32 y = 13;
  uint32 width = 14;             // cells
  uint32 height = 15;
  string name = 16;
  string image = 17;             // \spr\item\... of the old client
  string intro = 18;
  uint32 price = 19;
  repeated ItemMagic base = 20;
  repeated ItemMagic require = 21;
  repeated ItemMagic magic = 22;
  uint32 version = 23;           // the item table set it was made from (items/v00N.json): the tooltip's "[min-max]" ranges
  uint32 gen_param = 24;         // gold: its goldequip row (1-based); script item: its magicscript row - the client's own table row
}

message InventorySync {          // G2C_ITEM_LIST ("ItemList" is a Godot class, so not that name)
  repeated ItemView items = 1;
  uint32 money = 2;
  uint32 bank_money = 3;
}

message ItemAdd {                // G2C_ITEM_ADD
  ItemView item = 1;
}

message ItemRemove {             // G2C_ITEM_REMOVE
  uint32 id = 1;
}

message ItemMove {               // C2G_ITEM_MOVE (the wish) and G2C_ITEM_MOVE (what happened)
  uint32 id = 1;
  uint32 room = 2;
  uint32 x = 3;
  uint32 y = 4;
  uint32 seq = 5;
}

message ItemEquipReq {           // C2G_ITEM_EQUIP
  uint32 id = 1;
  int32 part = 2;                // ITEM_PART; -1 = the part its kind goes to (KItemList::GetEquipPlace)
  uint32 seq = 3;
}

message ItemUnequipReq {         // C2G_ITEM_UNEQUIP
  uint32 part = 1;
  uint32 seq = 2;
}

message ItemUseReq {             // C2G_ITEM_USE
  uint32 id = 1;
  uint32 seq = 2;
}

message ItemDropReq {            // C2G_ITEM_DROP
  uint32 id = 1;
  uint32 seq = 2;
}

message ItemResult {             // G2C_ITEM_RESULT: the request changed nothing
  uint32 seq = 1;
  Result result = 2;
}

message MoneySync {              // G2C_MONEY
  uint32 money = 1;
  uint32 bank_money = 2;
}

// The five attributes a point can go to (m_btAttribute of PLAYER_ATTRIBUTE_SYNC: 0 strength,
// 1 dexterity, 2 vitality, 3 energy)
enum PlayerAttribute {
  ATTRIB_STRENGTH = 0;
  ATTRIB_DEXTERITY = 1;
  ATTRIB_VITALITY = 2;
  ATTRIB_ENERGY = 3;
}

message AddPointReq {            // C2G_ADD_POINT: KPlayer::AddBaseStrength / Dexterity / Vitality / Engergy (points <= m_nAttributePoint)
  PlayerAttribute attribute = 1;
  uint32 points = 2;
  uint32 seq = 3;                // answered with G2C_PLAYER_ATTRIB (nothing changes when the points are not there)
}

message AddSkillPointReq {       // C2G_ADD_SKILL_POINT: KPlayer::AddSkillPoint (jx_linux_y 0x080BD460)
  uint32 skill_id = 1;
  uint32 points = 2;
  uint32 seq = 3;                // answered with G2C_SKILL_LEVEL when the old server answered (not for a skill not held / an exp skill)
}

message CastSkillReq {           // C2G_CAST_SKILL: the NpcSkillCommand packet of the old client (KNpc::SendCommand(do_skill))
  uint32 skill_id = 1;
  uint64 target = 2;             // the entity aimed at (0 = a spot)
  int32 x = 3;                   // the spot, scene units
  int32 y = 4;
  uint32 seq = 5;
}

message SetAuraReq {             // C2G_SET_AURA: the 0x6f packet {id} of KNpc::SetAura 0x005EA870 - the aura to keep casting (0 = none)
  uint32 skill_id = 1;
}

message SkillDescReq {           // C2G_SKILL_DESC: the tip of a skill (KSkill::GetDesc of the 2.0 client needs the level script's numbers)
  uint32 skill_id = 1;
  uint32 level = 2;              // the level shown (0 = not held: the next level only, as KSkill::GetDesc with ulCurLevel 0)
}

message ReviveReq {              // C2G_REVIVE: the revive request of the old client (KPlayer::Revive 0x080AD9F0, type 0)
  uint32 seq = 1;
}

message RideReq {                // C2G_RIDE: mount (on) or dismount the worn horse (the ride toggle 0x080AEFA0 of the old game)
  bool on = 1;
  uint32 seq = 2;
}

message SitReq {                 // C2G_SIT: the 0x71 packet {0x71, byte sit} of the 2.0 client (Switch([[sit]]) of the tool bar) -> handler 0x080DC300: sit (1) or stand (0)
  bool sit = 1;
  uint32 seq = 2;
}

message SkillLevelSync {         // G2C_SKILL_LEVEL: the 0x5e packet of the old server
  uint32 skill_id = 1;
  int32 level = 2;               // -1: the skill was taken away (DelMagic)
  uint32 skill_point = 3;        // m_nSkillPoint left
  uint32 exp_percent = 4;        // the experience bar of an exp skill, 0..1024 (1/1024 of the level's need)
  uint32 seq = 5;                // the AddSkillPointReq.seq this answers, 0 otherwise
  bool level_up = 6;             // the level moved by experience (the old server showed a message here)
}

message SkillEntry {
  uint32 skill_id = 1;
  int32 level = 2;               // SkillLevel: what was learned
  int32 current_level = 3;       // CurrentSkillLevel: with the increments of equipment / states
  uint32 exp_percent = 4;        // 0..1024
  int32 max_level = 5;
  int32 req_level = 6;           // the character level the skill asks for
  bool forbidden = 7;
  uint32 cool_down_left = 8;     // frames until it can be cast again
  bool only_inc = 9;             // held through increments only (level 0)
}

message SkillListSync {          // G2C_SKILL_LIST: every skill held, on entering the world (s2c_synccurplayerskill)
  repeated SkillEntry skills = 1;
  bool forbid_all = 2;
}

message SkillForbidSync {        // G2C_SKILL_FORBID: the 0x63 packet (ForbitSkill: skill_id 0 = every skill)
  uint32 skill_id = 1;
  bool forbid = 2;
}

// Everything the character window shows about the character itself, sent on entering the
// world and whenever it changes (a level, a point spent, a piece worn or taken off, damage
// taken updates only life through EntityLife).  The base numbers are the character's own,
// the current ones include equipment, skills and states (KPlayer::UpdataCurData).
message PlayerAttribSync {       // G2C_PLAYER_ATTRIB
  uint32 level = 1;
  uint64 exp = 2;
  uint64 next_level_exp = 3;     // m_nNextLevelExp: what this level needs to become the next
  uint32 attribute_point = 4;
  uint32 skill_point = 5;
  int32 strength = 6;            // base points
  int32 dexterity = 7;
  int32 vitality = 8;
  int32 energy = 9;
  int32 lucky = 10;
  int32 cur_strength = 11;       // current points
  int32 cur_dexterity = 12;
  int32 cur_vitality = 13;
  int32 cur_energy = 14;
  int32 cur_lucky = 15;
  int32 life = 16;
  int32 life_max = 17;           // m_CurrentLifeMax in use
  int32 mana = 18;
  int32 mana_max = 19;
  int32 stamina = 20;
  int32 stamina_max = 21;
  int32 attack_rating = 22;      // m_CurrentAttackRating
  int32 defend = 23;             // m_CurrentDefend
  int32 min_damage = 24;         // m_PhysicsDamage
  int32 max_damage = 25;
  int32 fire_resist = 26;        // the current resistances in use
  int32 cold_resist = 27;
  int32 poison_resist = 28;
  int32 light_resist = 29;
  int32 physics_resist = 30;
  int32 walk_speed = 31;
  int32 run_speed = 32;
  int32 attack_speed = 33;
  int32 cast_speed = 34;
  uint32 seq = 35;               // the AddPointReq.seq this answers, 0 otherwise
  int32 faction = 36;            // the login sync 0x080A9750 (+0xb0e / +0xb12): the current faction and the one last added, -1 = none
  int32 faction_last = 37;
  uint64 level_exp = 38;         // where this level starts (level_exp[level - 1]): the exp bar of the 2.0 top bar (Player_Exp 0x0044AD20) shows the way into the level
}

// KNpc::SetCamp 0x0807B7B0 (the 0x59 packet of the old game): a npc's camp (m_Camp) changed - a player joined or left a faction
message EntityCamp {             // G2C_ENTITY_CAMP
  uint64 entity_id = 1;
  int32 camp = 2;               // m_Camp (+0x21c; the 0x59 packet)
  int32 current_camp = 3;       // m_CurrentCamp (+0x220; SetCurrentCamp 0x0807B850, the 0x58 packet)
}

// KPlayer::SetFaction 0x080AEEC0 (the 0x7b packet: camp, current faction, last added, times joined) and KPlayer::ClearFaction
// 0x080AEDE0 (the 0x7c packet: the current faction becomes -1, the camp 4 = C_FREE); the client's skill book takes the branch
// pages of faction_last (GDI 0x413 reads PlayerData+0x12080)
message PlayerFaction {          // G2C_PLAYER_FACTION
  int32 camp = 1;
  int32 faction = 2;             // -1 = none
  int32 faction_last = 3;
  uint32 faction_count = 4;
}

// one attribute a skill's state applies (KMagicAttrib: id + three values) - the 16 byte cells of the 0x87 packet
message StateAttrib {
  int32 type = 1;
  int32 v0 = 2;
  int32 v1 = 3;
  int32 v2 = 4;
}

// KNpc::SetStateSkillEffect 0x08086260 (the 0x87 packet, to the player itself: {npc id, skill, level, time, byte, n x
// state cells}) and RemoveStateSkillEffect 0x0807D310 (the same with level 63, time 0 and no cells = removed): a timed
// state of a skill on the character - the skill state list of the 2.0 client (技能状态列表.ini) shows its icon and time
message EntityState {            // G2C_ENTITY_STATE
  uint64 entity_id = 1;
  uint32 skill_id = 2;
  uint32 level = 3;
  int32 time = 4;                // frames left (18 a second), -1 = until removed
  uint32 special_id = 5;         // KSkill::StateSpecialId
  bool removed = 6;
  repeated StateAttrib states = 7;
}

message SkillDescAttrib {        // one KMagicAttrib of a skill level, named as the tables spell it (magic_attrib_name)
  int32 group = 1;               // 0 immediate, 1 damage, 2 state - the order KSkill::GetDescAboutLevel prints them
  string name = 2;
  int32 v0 = 3;
  int32 v1 = 4;
  int32 v2 = 5;
}

message SkillDescAppend {        // addskilldamage 1 to 6 of the level: "Tang cho ky nang <name>: <value> percent"
  int32 skill_id = 1;
  int32 value = 2;
}

message SkillDescRelated {       // a skill named inside a level's lines by 0x006F7F70 of the 2.0 client (docs/CLIENT-2.0.md 10.1)
  int32 skill_id = 1;
  int32 level = 2;               // the instance described: min(held, listed) of an append skill; EventSkillLevel or the level itself of an event skill
  int32 flags = 3;               // the flags of 0x006F7F70: 1 = no "Chieu N:" prefix, 2 = no name, 4 = no "[Cap N]"
  repeated SkillDescAttrib attribs = 4;   // its three attribute groups (0x006F82F0); its own related skills follow in the list (0x006FAA00 recurses)
}

message SkillDescLevel {         // what the level script left in the KSkill of one level
  uint32 level = 1;
  int32 cost = 2;                // CostValue after skill_cost_v
  int32 cost_type = 3;           // 0 mana, 1 stamina, 2 life
  int32 attack_radius = 4;
  repeated SkillDescAttrib attribs = 5;
  repeated SkillDescAppend appends = 6;
  repeated SkillDescRelated related = 7;   // in print order: the append skills held (skill_appendskill), then the event skills ShowEvent names
}

message EntityStateIcons {       // G2C_STATE_ICONS: the 0x7a packet {0x7a, 6 icon bytes, npc id} of KNpc 0x08079F60 - the six StateSpecialId icons
  uint64 entity_id = 1;          // over an npc (an aura's, the states'; a player's are blank unless its sync_aura), sorted by priority toward the end
  repeated uint32 icons = 2;     // six cells, 0 = empty
}

message MissleSync {             // G2C_MISSLE: a KMissle of the zone as KMissle::Paint / KMissleRes::Draw of the old client draw it
  uint32 index = 1;              // the slot of KMissleSet: the key of a missile while it lives
  uint32 missle_id = 2;          // the row of missles.txt (AnimFile*, LoopPlay, Sub*, MultiShow)
  uint32 skill_id = 3;
  uint32 level = 4;
  uint64 launcher = 5;
  int32 x = 6;                   // scene units (the cell * 32 + the offset / 1024)
  int32 y = 7;
  int32 z = 8;                   // m_nCurrentMapZ (the height >> 10)
  uint32 dir = 9;                // 0 to 63
  int32 x_factor = 10;           // the flight vector, x1024 per unit of speed
  int32 y_factor = 11;
  int32 speed = 12;              // units a frame
  int32 life_time = 13;          // frames, the start delay included
  int32 start_life_time = 14;
  int32 current_life = 15;       // frames since creation when this was sent
  uint32 status = 16;            // 0 wait, 1 fly, 2 vanished
  bool removed = 17;             // the slot is freed: the vanish movie, then nothing
  uint32 move_kind = 18;
  bool collided = 19;            // a blow landed this frame at (x, y): the collision movie (AnimFile4) plays there (KMissle::DoCollision)
  int32 height = 20;             // m_nHeight (MissleHeight << 10, 1/1024 units): z = height >> 10; the client climbs between syncs
  int32 height_speed = 21;       // m_nHeightSpeed (Zspeed, or the climb of a MoveKind 7 missile): height += it each frame
  int32 z_acceleration = 22;     // m_nZAcceleration (Zacc): height_speed -= it each frame; not 0 = drawn facing its vector (KMissle::Paint 1531)
}

message SkillDesc {              // G2C_SKILL_DESC
  uint32 skill_id = 1;
  bool with_cur = 2;             // cur is filled (a bool of its own: the C++ generator owns has_cur())
  SkillDescLevel cur = 3;        // the level asked for (1 to the max level)
  bool with_next = 4;
  SkillDescLevel next = 5;       // the level after it, when there is one
  uint32 max_level = 6;
  int32 level_inc = 7;           // the increments of the skill list on the level shown (0x006233B0 with - 0x00623380 without): G_Skills_38 "Cap hien tai: %d (%d+%d)" when not 0
  int32 enhance = 8;             // KSkillList::enhance[skill] (+0xf14 of the 2.0 list, the addskilldamage of the skills held): G_Skills_39 when not 0
  uint32 held_level = 9;         // the level the zone described as the current one (the list's current level, increments included)
  int32 equip_percent = 10;      // the asker's magicdamage_p (244, +0x1284; the 2.0 client's Npc+0x1148): G_Skills_76 "Trang bi gom co: %d%%" when the
                                 // skill's Attrib is a [SkillType] 1 / 2 (the client's +0x1278 part comes from its attribute 299
                                 // movedistanc_710_enhance, which this jx_linux_y build does not have)
  bool with_modifier = 11;       // the asker's state modifier (KNpc+0x19d8, the client's Player+0x12ac8) aims at this skill: G_Skills_76 + its line
  SkillDescAttrib modifier = 12; // that attribute (index / delta as one KMagicAttrib), described by [Descript] (0x005EC4F0 -> KMagicDesc::GetDesc)
}

// The player was moved to another map (KNpc::ChangeWorld across subworlds on the old server).
// The client drops every entity, loads the bundle and waits for the EntitySpawn of the new
// surroundings (which includes the player itself).
message ChangeMap {
  uint32 map_id = 1;
  Vec2 pos = 2;
  uint32 scene_w = 3;
  uint32 scene_h = 4;
  uint64 entity_id = 5;          // the player's entity in the new map
}

message ChatMsg {
  uint64 entity_id = 1;
  string name = 2;
  string text = 3;
}

message Ping {
  uint64 client_ms = 1;
}

message Pong {
  uint64 client_ms = 1;
  uint64 server_ms = 2;
  uint64 tick = 3;
}

message Kick {
  Result reason = 1;
  string text = 2;
}
