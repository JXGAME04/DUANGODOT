// Message id registry.  Every frame on the wire carries one of these ids (see docs/PROTOCOL.md).
//   1000-1999  C2G   client -> gateway
//   2000-2999  G2C   gateway -> client
//   9000-9999  internal gateway <-> zone
// Never reuse a number.  Ids marked (zone) are forwarded by the gateway to the zone as ClientPacket.
syntax = "proto3";
package jx.pb;
option go_package = "github.com/JXGAME04/DUANGODOT/next/services/pkg/jxpb";

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_VERSION = 1;
}

enum MsgId {
  MSG_NONE = 0;

  // client -> gateway
  C2G_HELLO = 1001;
  C2G_LOGIN = 1002;
  C2G_CHAR_LIST = 1003;
  C2G_CHAR_CREATE = 1004;
  C2G_ENTER_WORLD = 1005;
  C2G_LEAVE_WORLD = 1006;
  C2G_PING = 1007;
  C2G_MOVE = 1101;             // (zone)
  C2G_CHAT = 1102;             // (zone)
  C2G_ATTACK = 1103;           // (zone)
  C2G_ITEM_MOVE = 1104;        // (zone) an item to another cell / room
  C2G_ITEM_EQUIP = 1105;       // (zone) wear an item from the bag
  C2G_ITEM_UNEQUIP = 1106;     // (zone) take a worn item off into the bag
  C2G_ITEM_USE = 1107;         // (zone) eat a medicine / use an item
  C2G_ITEM_DROP = 1108;        // (zone) throw an item away: it lies on the ground for a while
  C2G_PICK_UP = 1109;          // (zone) pick up an item / money from the ground
  C2G_ADD_POINT = 1110;        // (zone) spend attribute points (KPlayer::AddBaseStrength.. of the old c2s_playeraddattribute)
  C2G_ADD_SKILL_POINT = 1111;  // (zone) spend skill points on a skill (KPlayer::AddSkillPoint)
  C2G_CAST_SKILL = 1112;       // (zone) cast a skill at a target or a spot (NpcSkillCommand -> KNpc::SendCommand(do_skill))
  C2G_REVIVE = 1113;           // (zone) a dead character asks to revive at its revive point (the handler slot 118 -> KPlayer::Revive(0))
  C2G_RIDE = 1114;             // (zone) mount / dismount the worn horse (0x080AEFA0 -> KNpc::SetHorse 0x0807D520)
  C2G_SKILL_DESC = 1115;       // (zone) the numbers of a skill level for its tip (KSkill::GetDesc 0x006FBC90 of the 2.0 client runs the level script; the zone answers)
  C2G_SET_AURA = 1116;         // (zone) the aura switched on: the 0x6f packet of KNpc::SetAura 0x005EA870 (the right-mouse skill is an aura) -> handler cell 111 0x080DC460 -> KNpc::SetAura 0x08087290
  C2G_SIT = 1117;              // (zone) sit down / stand up: the 0x71 packet -> handler cell 113 0x080DC300 -> 0x08078AA0(npc, 8 / 1)
  C2G_PK_STATE = 1118;         // (zone) the PK switch: the 0x76 packet {byte state} -> 0x080DBE00 -> KPlayerPK::SetPKState 0x080C3740
  C2G_TEAM = 1119;             // (zone) a team command: the 0x53 packet {0x53, word len, byte sub 1..11, dword npc} of jx_linux_y (docs/LINUX-SERVER.md §17)
  C2G_TRADE = 1120;
  C2G_NPC_DIALOG = 1121;       // (zone) the 0x6e packet {0x6e, dword npc id, dword sync}: KPlayer::DialogNpc 0x080B1300 (docs/LINUX-SERVER.md §20)
  C2G_TASK_VALUE = 1123;       // (zone) the 0xaa packet {0xaa, int id, int value} (0x080DB070): a CLIENT_FLAG value of player_task_def.txt set by the client (docs/LINUX-SERVER.md §21)
  C2G_DIALOG_ANSWER = 1122;    // (zone) the 0x5f packet {0x5f, int index, int kind, int, int}: the answer of a Say / Talk (0x080AC5D0)            // (zone) a trade command: the trade packets of jx_linux_y (apply open / close / start, reply, money 0x6c, decision 0x6d; docs/LINUX-SERVER.md §18)

  // gateway -> client
  G2C_HELLO_ACK = 2001;
  G2C_LOGIN_RES = 2002;
  G2C_CHAR_LIST_RES = 2003;
  G2C_CHAR_CREATE_RES = 2004;
  G2C_ENTER_WORLD_RES = 2005;
  G2C_PONG = 2007;
  G2C_KICK = 2008;
  G2C_ENTITY_SPAWN = 2101;
  G2C_ENTITY_DESPAWN = 2102;
  G2C_ENTITY_MOVE = 2103;
  G2C_CHAT_MSG = 2104;
  G2C_ENTITY_ACTION = 2105;    // attack / hurt / death / revive (old NPC_HURT_SYNC, NPC_DEATH_SYNC, skill sync)
  G2C_ENTITY_LIFE = 2106;
  G2C_CHANGE_MAP = 2107;       // the zone moved the player to another map (NewWorld of a trap script)
  G2C_ENTITY_MOVES = 2108;     // several EntityMove in one frame: what moved far from the receiver, every few ticks (N3)
  G2C_ITEM_LIST = 2109;        // everything the character carries, on entering the world
  G2C_ITEM_ADD = 2110;         // a new item, or a stack that changed (same id, new count)
  G2C_ITEM_REMOVE = 2111;      // an item is gone (used up, dropped)
  G2C_ITEM_MOVE = 2112;        // an item lies somewhere else now (also the answer to C2G_ITEM_MOVE / EQUIP / UNEQUIP)
  G2C_ITEM_RESULT = 2113;      // a request that changed nothing, with why
  G2C_MONEY = 2114;            // money in the bag and the repository
  G2C_PLAYER_ATTRIB = 2115;    // the character's own numbers (CURPLAYER_SYNC + PLAYER_ATTRIBUTE_SYNC + PLAYER_LEVEL_UP_SYNC of the old game)
  G2C_SKILL_LIST = 2116;       // every skill the character holds (s2c_synccurplayerskill)
  G2C_SKILL_LEVEL = 2117;      // one skill's level / experience / the skill points left (the 0x5e packet)
  G2C_SKILL_FORBID = 2118;     // a skill (or all) locked or freed (the 0x63 packet)
  G2C_ENTITY_RIDE = 2119;      // a npc mounted or dismounted (the 0x20 flag of the old 0x4c / 0x4d sync)
  G2C_ENTITY_CAMP = 2120;      // a npc's camp changed (the 0x59 packet)
  G2C_PLAYER_FACTION = 2121;   // the character's faction record (the 0x7b packet; 0x7c = cleared)
  G2C_ENTITY_STATE = 2122;     // a skill's timed state on the character (the 0x87 packet; empty = removed)
  G2C_SKILL_DESC = 2123;       // the answer to C2G_SKILL_DESC: cost / range / attributes of the level shown and of the next one
  G2C_MISSLE = 2124;           // a missile of a cast: born, flying (a position every 6 frames), gone - the client draws it (the 2.0 client re-runs CastMissles from the 0x5a packet instead)
  G2C_STATE_ICONS = 2125;      // the 0x7a packet (0x08079F60): the six state icons over an npc, sent when they changed (aura, states)
  G2C_NPC_GOLD = 2126;         // the 0x9a packet (0x0809DF66): a monster turned gold - its kind (NpcGoldTemplate row + 1)
  G2C_ENTITY_RES = 2127;       // the 0xad packet (0x0807A9D0): a player's equipment look (helm / armour / weapon / horse / mantle rows)
  G2C_PK_STATE = 2128;         // the 0x90 / 0x93 packets: the character's own PK state and value
  G2C_ENTITY_PK = 2129;        // a player's PK state for the others (the flag & 3 of the 0x4b sync)
  G2C_TEAM_SELF = 2130;        // one's own team as it stands (s2c_teamselfinfo: the 0x69 packet of KPlayer::SendSelfTeamInfo 0x080AA7F0)
  G2C_TEAM_EVENT = 2131;       // a team happening (the other 0x69 sub-commands and the 0x86 team messages)
  G2C_TRADE_STATE = 2132;      // s2c_tradechangestate (KPlayerMenuState::SetState 0x080C29D0): 0 normal, 1 open for trade, 2 trading {partner}
  G2C_TRADE_SYNC = 2133;       // the 0x81 packet of SyncTradeState 0x080A85B0 {self lock, dest lock, self ok, dest ok} + the 0x77 money of the partner
  G2C_TRADE_ITEM = 2134;       // the partner's trade box: an item put there (the 0xcc-byte sync of ExchangeItem 0x08206110) or taken back
  G2C_TRADE_APPLY = 2135;      // the 0x8b packet (0x080B4DE0): somebody asks to trade with the receiver
  G2C_TRADE_END = 2136;        // the 0x78 packet: the trade is over {ok = the exchange happened, 0 = cancelled}
  G2C_SYS_MSG = 2137;          // the 0x86 packet {word 8, word id, dword npc}: a sentence of stringtable_core.txt by id (docs/CLIENT-2.0.md §21)
  G2C_ENTITY_MENU_STATE = 2138;
  G2C_TASK_VALUE = 2140;       // the 0xa7 packet {0xa7, int id, int value} of KPlayer::SetTaskValue 0x080A9190 / SyncTaskValue (0x080A8CC0) -> the client's 0x006512F0 (docs/LINUX-SERVER.md §21)
  G2C_TASK_VALUES = 2141;      // the 0xb5 packet of SyncTaskValueMore 0x080A9550: up to eighty {id, value} (the client's 0x00651350)
  G2C_TASK_TIP = 2142;         // the 0xb6 packet of Lua TaskTip 0x08122730 {0xb6, 0x10, text[0x3e]} -> the client's 0x00651390 -> ui message 0x5d -> the system message pane (系统消息.ini) (docs/LINUX-SERVER.md §25)
  G2C_SCRIPT_ACTION = 2139;    // the 0x63 packet PLAYER_SCRIPTACTION_SYNC: Say (a sentence + answers) / Talk (pages) of a npc script (docs/LINUX-SERVER.md §20)   // s2c_npcsetmenustate: the sign over a player's head (1 looking for team mates, 2 trading wanted + sentence, 3 trading)

  // gateway <-> zone
  GZ_ZONE_HELLO = 9001;
  ZG_ZONE_HELLO_ACK = 9002;
  GZ_SESSION_OPEN = 9003;
  ZG_SESSION_OPEN_ACK = 9004;
  GZ_SESSION_CLOSE = 9005;
  GZ_CLIENT_PACKET = 9006;
  ZG_ZONE_PACKET = 9007;
  ZG_PLAYER_SAVE = 9008;
  ZG_ZONE_STATS = 9009;
}
