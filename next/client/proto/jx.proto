// GENERATED by tools/gen_proto.py from proto/jx/*.proto - do not edit.
syntax = "proto3";

// ---- client.proto ----
// Client <-> gateway messages.  C2G = client to gateway, G2C = gateway to client.
// Some C2G messages are forwarded unchanged to the zone (see MsgId comments in msg.proto).


// ---- handshake / auth ------------------------------------------------------------------

message Hello {
  uint32 protocol_version = 1;   // PROTOCOL_VERSION in msg.proto
  string client_version = 2;
  string platform = 3;           // "windows", "linux", "android", ...
  string device_id = 4;
}

message HelloAck {
  uint32 protocol_version = 1;
  uint64 server_time_ms = 2;
  string server_version = 3;
  uint64 sid = 4;                // session id, useful when reading logs
  string auth_mode = 5;          // "dev" (first login registers the account) or "strict" (registered accounts only)
  uint32 heartbeat_s = 6;        // the gateway drops a silent in-world session after this many seconds; ping more often
}

message LoginReq {
  string account = 1;
  string password = 2;           // dev auth only; real auth uses tokens (phase 3)
}

message LoginRes {
  Result result = 1;
  uint64 account_id = 2;
  string text = 3;               // human readable reason (field names must avoid protobuf keywords: godobuf)
}

// ---- characters ------------------------------------------------------------------------

message CharSummary {
  uint64 player_id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 series = 4;
  uint32 sex = 5;
  int32 faction = 6;          // KPlayerFaction::m_nCurFaction: 0..10, -1 = none
  uint32 zone_id = 7;
}

message CharListReq {}

message CharListRes {
  Result result = 1;
  repeated CharSummary chars = 2;
  uint32 max_chars = 3;
}

message CharCreateReq {
  string name = 1;
  uint32 series = 2;
  uint32 sex = 3;
  // The starting village the player picked (KUiSelNativePlace): the Id of Settings/NativePlaceList.ini,
  // which is the map id of the village (53 Ba Lang Huyen, 20 Giang Tan Thon...).  0 = not chosen.
  uint32 native_place = 4;
}

message CharCreateRes {
  Result result = 1;
  CharSummary summary = 2;
}

message EnterWorldReq {
  uint64 player_id = 1;
}

message EnterWorldRes {
  Result result = 1;
  uint32 zone_id = 2;
  string zone_name = 3;
  uint64 entity_id = 4;          // the entity that belongs to this client in the zone
  Vec2 pos = 5;
  uint32 tick_hz = 6;
  uint32 map_id = 7;             // which map bundle to draw (0 = plain grid)
  uint32 scene_w = 8;
  uint32 scene_h = 9;
}

message LeaveWorldReq {}

// ---- world (zone) ----------------------------------------------------------------------

// Server authoritative movement: the client asks to move towards a target, the zone
// simulates and broadcasts EntityMove to everyone who can see the entity.
message MoveReq {
  Vec2 target = 1;
  uint32 seq = 2;                // client sequence number, echoed in EntityMove for the own entity
}

// Basic melee attack on a target (KNpc::DoAttack).  The zone repeats the swing until the target
// dies, the player moves or the target leaves reach.
message AttackReq {
  uint64 target = 1;
  uint32 seq = 2;
}

// KNpc::m_Doing as far as clients need it.
enum Action {
  ACTION_STAND = 0;
  ACTION_ATTACK = 1;             // frames = swing length in logic frames (18 Hz), dir = facing, target
  ACTION_HURT = 2;               // frames = hurt length (KNpc::DoHurt), pos = where the entity stands
  ACTION_DEATH = 3;              // frames = death animation; the corpse keeps the last frame until despawn
  ACTION_REVIVE = 4;
  ACTION_JUMP = 5;               // a jump of a style-1 skill (the 0x54 packet of KNpc 0x0807B320): aim = where it lands, frames = the frames in the air
  ACTION_KNOCK_BACK = 6;         // KNpc::KnockBack 0x08087940 -> SendSyncAction 0x0807A970 (the 0x56 packet, doing 0x18): aim = the spot pushed to, frames = the frames of the push, target = who pushed
  ACTION_SIT = 7;                // KNpc::DoSit 0x0807B550 (the 0x83 packet {npc id} around, the 0x9f {6, 1} to oneself): m_Doing 8, frames = m_SitFrame 15 - the last frame is held (0x08087880)
}

// An entity started an action (old NPC_HURT_SYNC / NPC_DEATH_SYNC / skill sync).
message EntityAction {
  uint64 entity_id = 1;
  Action action = 2;
  uint64 target = 3;
  uint32 dir = 4;
  uint32 frames = 5;
  Vec2 pos = 6;
  uint64 tick = 7;
  uint32 skill_id = 8;           // ACTION_ATTACK: the skill cast (the 0x5a packet of KNpc::CastSkill), 0 = a plain swing
  uint32 skill_level = 9;
  Vec2 aim = 10;                 // the spot aimed at when target is 0
}

// Life changed (damage / heal), sent to everyone who sees the entity.
message EntityLife {
  uint64 entity_id = 1;
  uint32 life = 2;
  uint32 life_max = 3;
  int32 delta = 4;               // negative = damage
  uint64 source = 5;
}

message EntityInfo {
  uint64 entity_id = 1;
  EntityType entity_type = 2;
  string name = 3;
  Vec2 pos = 4;
  Vec2 target = 5;               // where it is currently moving to (== pos when idle)
  uint32 move_speed = 6;
  uint32 level = 7;
  uint32 series = 8;
  uint32 sex = 9;
  uint32 template_id = 10;       // npc/monster template, 0 for players
  repeated Vec2 path = 11;       // remaining waypoints after pos (server pathfinding)
  uint32 dir = 12;               // facing direction 0..63 (old g_GetDirIndex: 0 = down, clockwise on screen)
  uint32 life = 13;
  uint32 life_max = 14;
  Action doing = 15;             // what it is doing right now (a corpse reports ACTION_DEATH)
  uint32 doing_frames = 16;
  uint32 count = 17;             // ENTITY_DROP: the stack of the item, or the coins of a money pile (template_id = ObjData row)
  int32 hide = 18;               // > 0: hidden ([hide] 200 of a state) - only its own client is sent it then (the hide bit of the old 0x4d status packet)
  bool riding = 19;              // on its horse (KNpc+0x199c, the 0x20 flag of the 0x4c / 0x4d packets)
  uint32 gold_type = 20;         // the gold word of the 0x4c packet (0x0807FCA5): KNpcGold::GetGoldKind = the NpcGoldTemplate row + 1 while gold, 0 plain; a boss
                                 // (+0x181c != 0) carries the table's count + 1 - the 2.0 client colours the name by it (0x005F23E5: 0xFF6365FF, above its table 0xFFEBB200)
  int32 camp = 21;               // m_Camp +0x21c (the byte +0xb of the 0x4c packet -> the client's KNpc+0xf4)
  int32 current_camp = 22;       // m_CurrentCamp +0x220 (the byte +3 -> KNpc+0xf8): the colour of a player's name (0x005F2507, the table 0x5f2d94)
  // +0x14dc..+0x14ec of the 0x4a / 0x4b player sync (0x0807BF86, 0x080813BD): the equipment rows of the main characters'
  // part tables the client dresses a player in (KNpc+0x13f0 helm, +0x13f4 armour, +0x1400 weapon, +0x13fc horse, +0x13f8 mantle)
  int32 helm_res = 23;
  int32 armor_res = 24;
  int32 weapon_res = 25;
  int32 horse_res = 26;          // -1 = no horse (HorseRes level 0)
  int32 mantle_res = 27;         // -1 = none
  int32 pk_state = 28;           // a player's PK state (Player+0x5a50 & 3 in the 0x4a / 0x4b flag -> KNpc+0x16e4): 0 exercise, 1 fight, 2 kill
  // the full sync 0x4c of a player (0x0807FDD8): byte +0x10 = KPlayerMenuState Player+0x5700 (0 normal, 1 team open, 2 trade
  // open, 3 trading, 4 idle) and the sentence Player+0x570c (at most 0x1e bytes) after the name - the 2.0 client's handler
  // 0x0065C070 calls KNpc::SetMenuState with them (0x0065C4ED), so a sign already up is seen by whoever walks in
  uint32 menu_state = 29;
  string menu_sentence = 30;
  uint32 npc_kind = 31;          // NPCKIND of npcs.txt (byte +0x13 of the 0x4c packet): 0 monster, 2 partner, 3 dialoger (a click talks, 0x6e), 4 bird, 5 mouse
}

// ---- npc dialog (M13) ----

message NpcDialogReq {           // C2G_NPC_DIALOG: the 0x6e packet - a click on a npc within twice its m_DialogRadius (124)
  uint64 npc = 1;
  uint32 seq = 2;
}

message DialogAnswer {           // C2G_DIALOG_ANSWER: the 0x5f packet {0x5f, int index, int kind, int, int} of KPlayer::OnSelectFromUI (2.0 0x005FC7D0)
  int32 index = 1;               // the answer picked (0-based); a Talk's last page confirmed = 0
  int32 kind = 2;                // the dword at +5: 0 = a Say / Talk answer (0x080AC5D0), 1 = the item selection ui (0x081F68C0, not ported)
}

// The 0x63 packet PLAYER_SCRIPTACTION_SYNC (2003 KProtocol.h) as Lua Say 0x08123C90 / Talk 0x08116930 of jx_linux_y fill it:
// byte m_nOperateType +3, m_bUIId +4, m_bOptionNum +5, m_bParam1 +6 (1 = the sentence is a string-table id), m_bParam2 +7
// (1 = the answer goes to the server), int m_nParam +9 (Say -1; Talk 1 = the last page's confirm goes back), int m_nBufferLen
// +0xd, the content +0x11: the sentence then the answers NUL-separated (Say), or the pages joined with "| |" (Talk).  The
// 2.0 client's KPlayer::OnScriptAction 0x006004C0 shows ui 0 in KUiMsgSel (滚动选择界面.ini) and ui 2 in KUiInformation2
// (提示2.ini, "Tiếp tục" G_PLAYER_14 / "Hoàn thành" G_PLAYER_15).
message ScriptAction {
  uint32 operate = 1;            // 0 SCRIPTACTION_UISHOW (1 EXESCRIPT "OnCall": the client runs its own script - never sent by the zone)
  uint32 ui_id = 2;              // UIInfo: 0 UI_SELECTDIALOG (Say), 2 UI_TALKDIALOG (Talk)
  string text = 3;               // the sentence (Say)
  int32 text_id = 4;             // m_bParam1 = 1: the sentence is this string-table id instead (g_GetStringRes of the client)
  bool interactive = 5;          // m_bParam2
  int32 param = 6;               // m_nParam
  repeated string options = 7;   // the answers (Say, the text before the '/') or the pages (Talk); the title (GiveItemUI)
  bool notify_changes = 8;       // +8 of the 0x63 packet: GiveItemUI's seventh argument - the client reports every change of its box (C2G_GIVE_ITEMS kind 0)
}

// one saved task value of the character (KPlayerTask, docs/LINUX-SERVER.md §21): the 0xa7 packet {0xa7, int id, int value}
message TaskValue {
  int32 id = 1;                  // 0..0x176f
  int32 value = 2;
}

// the 0xb5 packet of SyncTaskValueMore 0x080A9550: up to eighty values in one go (the login sends 1000..1070 this way)
message TaskValues {
  repeated TaskValue values = 1;
}

// C2G_TASK_VALUE: the 0xaa packet {0xaa, int id, int value} (0x080DB070) - the zone takes it for an id with CLIENT_FLAG in
// settings/task/player_task_def.txt and refuses every other one
message TaskValueReq {
  int32 id = 1;
  int32 value = 2;
}

// the 0xb6 packet of Lua TaskTip 0x08122730 (docs/LINUX-SERVER.md §25): 0x3e bytes of text after a 0x10 byte; the client's
// 0x00651390 hands it to the system message pane (0x004C4060: type 1, blinking icon, priority 3; 系统消息.ini)
message TaskTip {
  string text = 1;
}

// one piece the player put into the give-item box (the 0x89 packet, 5 bytes each: 0x080ABA20): where it lies in the
// player's list and the cell of the 6 x 4 box it was dropped on
message GiveItemEntry {
  uint32 room = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 cell_x = 4;             // 0..5
  uint32 cell_y = 5;             // 0..3
}

// C2G_GIVE_ITEMS: the 0x89 packet (0x080AC560): kind 0 = the box changed (the sixth argument's function of GiveItemUI
// runs with the count), anything else = "Đồng ý" (the confirm function runs with the count)
message GiveItemsReq {
  int32 kind = 1;
  repeated GiveItemEntry items = 2;
}

// G2C_GIVE_ITEM_MSG: SetUiGiveItemMsg (kind 0, the 0xd8 packet: a hint for the window) / SetUiGiveItemMoreConfirmMsg (kind 1,
// the 0xdf packet: the client's 0x0064FD10 -> ui message 0xa8, a box asking once more)
message GiveItemMsg {
  int32 kind = 1;
  string text = 2;
}

// G2C_SCRIPT_ASK: the 0xa3 packet (sub-command 2) of AskClientForNumber (kind 1: the number pad 数字键盘.ini) /
// AskClientForString (kind 0: the input box 输入字串界面.ini with the default text); the client's 0x006AC330 -> ui message 0x37
message ScriptAsk {
  int32 kind = 1;                // 1 number, 0 string
  string title = 2;              // 0x20 bytes in the packet
  int32 min = 3;
  int32 max = 4;
  string default_text = 5;       // 0x20 bytes (the string kind)
}

// C2G_SCRIPT_INPUT: the 0x82 packet - kind 3 {int} the number typed (0x081F6680: the answer function with it), kind 2
// {word len, text} the string typed (0x081F6730: the function with the text; an empty one is dropped)
message ScriptInput {
  int32 kind = 1;                // 3 number, 2 string
  int64 number = 2;
  string text = 3;
}

message PKStateReq {             // C2G_PK_STATE: the 0x76 packet {0x76, byte state} of the PK switch (0x080DBE00)
  int32 state = 1;
  uint32 seq = 2;
}

message PKState {                // G2C_PK_STATE: the 0x90 packet {state} of SetPKState 0x080C3740 and the 0x93 {value} of SetPKValue 0x080C38C0, to the owner
  int32 state = 1;
  int32 value = 2;               // 0..10
  bool refused = 3;              // the switch was not taken (the message 0x86 {4, 0x23}: the state must be held NormalPKTimeLong seconds)
}

message EntityPK {               // G2C_ENTITY_PK: a player's PK state for the watchers (the 0x4b sync of the binary)
  uint64 entity_id = 1;
  int32 pk_state = 2;
}

message EntityRes {              // G2C_ENTITY_RES: the 0xad packet (0x0807A9D0) - a player's look changed (a piece put on / taken off)
  uint64 entity_id = 1;
  int32 helm_res = 2;
  int32 armor_res = 3;
  int32 weapon_res = 4;
  int32 horse_res = 5;
  int32 mantle_res = 6;
  uint32 version = 7;            // +0x1504 (the client keeps it in KNpc+0x1408 and asks for a full sync when a 0x4b disagrees)
}

message NpcGold {                // G2C_NPC_GOLD: the 0x9a packet {0x9a, npc id, word kind} of SetGoldTypeAndBackData 0x0809DF66 - a monster turned gold (the 2.0 handler 0x00653110)
  uint64 entity_id = 1;
  uint32 gold_type = 2;          // as EntityInfo.gold_type
}

message EntityRide {             // G2C_ENTITY_RIDE: a npc mounted or dismounted (the flag of the next 0x4c / 0x4d sync in the old game)
  uint64 entity_id = 1;
  bool riding = 2;
}

message PickUpReq {              // C2G_PICK_UP: take the thing on the ground into the bag (KPlayer::ServerPickUpItem)
  uint64 entity_id = 1;
  uint32 seq = 2;                // answered with G2C_ITEM_ADD / G2C_MONEY, or G2C_ITEM_RESULT with the reason
}

message EntitySpawn {
  repeated EntityInfo entities = 1;
}

message EntityDespawn {
  repeated uint64 entity_ids = 1;
}

message EntityMove {
  uint64 entity_id = 1;
  Vec2 pos = 2;                  // position at tick
  Vec2 target = 3;               // final destination (last waypoint), == pos when idle
  uint32 move_speed = 4;
  uint64 tick = 5;
  uint32 seq = 6;                // MoveReq.seq when this is the receiver own entity
  repeated Vec2 path = 7;        // waypoints from pos to target; the client follows the same line
}

// The movements of entities FAR from the receiver, gathered over a few ticks into one frame
// (KSubWorld::flush_far, N3).  Each entry is the entity's latest state, exactly what an EntityMove
// would carry; the client handles them one by one.  What moves near the receiver still comes as a
// single EntityMove the moment it happens.
message EntityMoves {
  repeated EntityMove moves = 1;
}

// The chat channels of the 2.0 client (\ui\ui3_1024\消息集合面板_左.ini [Channels] Channel0..14, the FormatName of each
// = the relay's channel name of relay_channcfg.ini / relay_channel.ini: NEARBY 'S', TEAM 'T', WORLD, \F<Faction#> 'F',
// CITY 'B', TONG 'O', TONGUNION 'U', CHATROOM \C<ChatRoom#>).  The zone carries the ones a player can speak in.
enum ChatChannel {
  CH_NEARBY = 0;                 // Channel0: whoever sees the speaker (the relay's 'S' class 3 target = the player)
  CH_TEAM = 1;                   // Channel1: the team (the relay's 'T' class 0 target = Player+0x5998)
  CH_WORLD = 2;                  // Channel2: everybody (relay_channel.ini [WORLD] cost 4)
  CH_FACTION = 3;                // Channel3: the faction (\F<Faction#>, cost 3)
  CH_SYSTEM = 4;                 // Channel4: the server's lines (never sent by a client)
  CH_CITY = 5;                   // Channel5: the relay's [broadcast] name=CITY 'B' (class 4, cost 2)
  CH_TONG = 6;                   // Channel6: the tong (\O, cost 0) - no tongs in the zone yet
  CH_WHISPER = 7;                // the 2003 chat_someonechat: one player by name (the "/name text" of the input line)
}

message ChatReq {
  string text = 1;
  ChatChannel channel = 2;
  string target = 3;             // CH_WHISPER: the name spoken to
}

// ---- items (M11) ----

// One item as the client sees it: what the character holds (KItem) plus what its table row says
// (name, picture, size, price) so the bag window needs no table of its own.
message ItemView {
  uint32 id = 1;
  uint32 genre = 2;              // ITEMGENRE: 0 equipment, 1 medicine, 4 quest, 5 town portal, 6 script item
  uint32 detail = 3;
  uint32 particular = 4;
  uint32 level = 5;
  int32 series = 6;
  uint32 count = 7;
  int32 durability = 8;          // -1 = never wears
  int32 max_durability = 9;
  uint32 ex_type = 10;           // 0 normal, 1 gold, 2 platina, 3 purple
  uint32 room = 11;              // 0 bag, 1 repository, 2 trade, 3 quick slots, 10 worn (x = part)
  uint32 x = 12;
  uint32 y = 13;
  uint32 width = 14;             // cells
  uint32 height = 15;
  string name = 16;
  string image = 17;             // \spr\item\... of the old client
  string intro = 18;
  uint32 price = 19;
  repeated ItemMagic base = 20;
  repeated ItemMagic require = 21;
  repeated ItemMagic magic = 22;
  uint32 version = 23;           // the item table set it was made from (items/v00N.json): the tooltip's "[min-max]" ranges
  uint32 gen_param = 24;         // gold: its goldequip row (1-based); script item: its magicscript row - the client's own table row
}

message InventorySync {          // G2C_ITEM_LIST ("ItemList" is a Godot class, so not that name)
  repeated ItemView items = 1;
  uint32 money = 2;
  uint32 bank_money = 3;
}

message ItemAdd {                // G2C_ITEM_ADD
  ItemView item = 1;
}

message ItemRemove {             // G2C_ITEM_REMOVE
  uint32 id = 1;
}

message ItemMove {               // C2G_ITEM_MOVE (the wish) and G2C_ITEM_MOVE (what happened)
  uint32 id = 1;
  uint32 room = 2;
  uint32 x = 3;
  uint32 y = 4;
  uint32 seq = 5;
}

message ItemEquipReq {           // C2G_ITEM_EQUIP
  uint32 id = 1;
  int32 part = 2;                // ITEM_PART; -1 = the part its kind goes to (KItemList::GetEquipPlace)
  uint32 seq = 3;
}

message ItemUnequipReq {         // C2G_ITEM_UNEQUIP
  uint32 part = 1;
  uint32 seq = 2;
}

message ItemUseReq {             // C2G_ITEM_USE
  uint32 id = 1;
  uint32 seq = 2;
}

message ItemDropReq {            // C2G_ITEM_DROP
  uint32 id = 1;
  uint32 seq = 2;
}

message ItemResult {             // G2C_ITEM_RESULT: the request changed nothing
  uint32 seq = 1;
  Result result = 2;
}

message MoneySync {              // G2C_MONEY
  uint32 money = 1;
  uint32 bank_money = 2;
}

// The five attributes a point can go to (m_btAttribute of PLAYER_ATTRIBUTE_SYNC: 0 strength,
// 1 dexterity, 2 vitality, 3 energy)
enum PlayerAttribute {
  ATTRIB_STRENGTH = 0;
  ATTRIB_DEXTERITY = 1;
  ATTRIB_VITALITY = 2;
  ATTRIB_ENERGY = 3;
}

message AddPointReq {            // C2G_ADD_POINT: KPlayer::AddBaseStrength / Dexterity / Vitality / Engergy (points <= m_nAttributePoint)
  PlayerAttribute attribute = 1;
  uint32 points = 2;
  uint32 seq = 3;                // answered with G2C_PLAYER_ATTRIB (nothing changes when the points are not there)
}

message AddSkillPointReq {       // C2G_ADD_SKILL_POINT: KPlayer::AddSkillPoint (jx_linux_y 0x080BD460)
  uint32 skill_id = 1;
  uint32 points = 2;
  uint32 seq = 3;                // answered with G2C_SKILL_LEVEL when the old server answered (not for a skill not held / an exp skill)
}

message CastSkillReq {           // C2G_CAST_SKILL: the NpcSkillCommand packet of the old client (KNpc::SendCommand(do_skill))
  uint32 skill_id = 1;
  uint64 target = 2;             // the entity aimed at (0 = a spot)
  int32 x = 3;                   // the spot, scene units
  int32 y = 4;
  uint32 seq = 5;
}

message SetAuraReq {             // C2G_SET_AURA: the 0x6f packet {id} of KNpc::SetAura 0x005EA870 - the aura to keep casting (0 = none)
  uint32 skill_id = 1;
}

message SkillDescReq {           // C2G_SKILL_DESC: the tip of a skill (KSkill::GetDesc of the 2.0 client needs the level script's numbers)
  uint32 skill_id = 1;
  uint32 level = 2;              // the level shown (0 = not held: the next level only, as KSkill::GetDesc with ulCurLevel 0)
}

message ReviveReq {              // C2G_REVIVE: the revive request of the old client (KPlayer::Revive 0x080AD9F0, type 0)
  uint32 seq = 1;
}

message RideReq {                // C2G_RIDE: mount (on) or dismount the worn horse (the ride toggle 0x080AEFA0 of the old game)
  bool on = 1;
  uint32 seq = 2;
}

message SitReq {                 // C2G_SIT: the 0x71 packet {0x71, byte sit} of the 2.0 client (Switch([[sit]]) of the tool bar) -> handler 0x080DC300: sit (1) or stand (0)
  bool sit = 1;
  uint32 seq = 2;
}

message SkillLevelSync {         // G2C_SKILL_LEVEL: the 0x5e packet of the old server
  uint32 skill_id = 1;
  int32 level = 2;               // -1: the skill was taken away (DelMagic)
  uint32 skill_point = 3;        // m_nSkillPoint left
  uint32 exp_percent = 4;        // the experience bar of an exp skill, 0..1024 (1/1024 of the level's need)
  uint32 seq = 5;                // the AddSkillPointReq.seq this answers, 0 otherwise
  bool level_up = 6;             // the level moved by experience (the old server showed a message here)
}

message SkillEntry {
  uint32 skill_id = 1;
  int32 level = 2;               // SkillLevel: what was learned
  int32 current_level = 3;       // CurrentSkillLevel: with the increments of equipment / states
  uint32 exp_percent = 4;        // 0..1024
  int32 max_level = 5;
  int32 req_level = 6;           // the character level the skill asks for
  bool forbidden = 7;
  uint32 cool_down_left = 8;     // frames until it can be cast again
  bool only_inc = 9;             // held through increments only (level 0)
}

message SkillListSync {          // G2C_SKILL_LIST: every skill held, on entering the world (s2c_synccurplayerskill)
  repeated SkillEntry skills = 1;
  bool forbid_all = 2;
}

message SkillForbidSync {        // G2C_SKILL_FORBID: the 0x63 packet (ForbitSkill: skill_id 0 = every skill)
  uint32 skill_id = 1;
  bool forbid = 2;
}

// Everything the character window shows about the character itself, sent on entering the
// world and whenever it changes (a level, a point spent, a piece worn or taken off, damage
// taken updates only life through EntityLife).  The base numbers are the character's own,
// the current ones include equipment, skills and states (KPlayer::UpdataCurData).
message PlayerAttribSync {       // G2C_PLAYER_ATTRIB
  uint32 level = 1;
  uint64 exp = 2;
  uint64 next_level_exp = 3;     // m_nNextLevelExp: what this level needs to become the next
  uint32 attribute_point = 4;
  uint32 skill_point = 5;
  int32 strength = 6;            // base points
  int32 dexterity = 7;
  int32 vitality = 8;
  int32 energy = 9;
  int32 lucky = 10;
  int32 cur_strength = 11;       // current points
  int32 cur_dexterity = 12;
  int32 cur_vitality = 13;
  int32 cur_energy = 14;
  int32 cur_lucky = 15;
  int32 life = 16;
  int32 life_max = 17;           // m_CurrentLifeMax in use
  int32 mana = 18;
  int32 mana_max = 19;
  int32 stamina = 20;
  int32 stamina_max = 21;
  int32 attack_rating = 22;      // m_CurrentAttackRating
  int32 defend = 23;             // m_CurrentDefend
  int32 min_damage = 24;         // m_PhysicsDamage
  int32 max_damage = 25;
  int32 fire_resist = 26;        // the current resistances in use
  int32 cold_resist = 27;
  int32 poison_resist = 28;
  int32 light_resist = 29;
  int32 physics_resist = 30;
  int32 walk_speed = 31;
  int32 run_speed = 32;
  int32 attack_speed = 33;
  int32 cast_speed = 34;
  uint32 seq = 35;               // the AddPointReq.seq this answers, 0 otherwise
  int32 faction = 36;            // the login sync 0x080A9750 (+0xb0e / +0xb12): the current faction and the one last added, -1 = none
  int32 faction_last = 37;
  uint64 level_exp = 38;         // where this level starts (level_exp[level - 1]): the exp bar of the 2.0 top bar (Player_Exp 0x0044AD20) shows the way into the level
}

// ---- teams (KPlayerTeam / KTeam of the old game, docs/LINUX-SERVER.md §17) ----------------------------------------------------

enum TeamCmd {                   // the sub-command byte of the 0x53 packet (the jump table 0x8257f48 of the handler 0x080DCC90)
  TEAM_CMD_NONE = 0;
  TEAM_INFO = 1;                 // the team of a npc around (KPlayer::S2CSendTeamInfo 0x080B1AD0): target = npc id
  TEAM_CREATE = 2;               // KPlayerTeam::CreateTeam 0x080CE3C0
  TEAM_OPEN_CLOSE = 3;           // KPlayer::SetTeamState 0x080B1CF0: flag 1 open / 0 close
  TEAM_APPLY_ADD = 4;            // KPlayer::S2CSendAddTeamInfo 0x080B8000: ask a captain (target) to be taken in
  TEAM_ACCEPT = 5;               // KPlayer::AddTeamMember 0x080B75B0: the captain takes an applicant (target)
  TEAM_LEAVE = 6;                // KPlayer::LeaveTeam 0x080B7C60
  TEAM_KICK = 7;                 // KPlayer::TeamKickOne 0x080B9880: target
  TEAM_CHANGE_CAPTAIN = 8;       // KPlayer::TeamChangeCaptain 0x080B9400: target
  TEAM_DISMISS = 9;              // KPlayer::TeamDismiss 0x080B7DE0
  TEAM_INVITE = 10;              // KPlayerTeam::InviteAdd 0x080CE150: the captain invites target
  TEAM_REPLY_INVITE = 11;        // KPlayerTeam::GetInviteReply 0x080CCBA0: target = the captain, flag 1 accept / 0 refuse
}

message TeamReq {                // C2G_TEAM
  TeamCmd cmd = 1;
  uint64 target = 2;             // the npc (entity) the command is about
  int32 flag = 3;
  uint32 seq = 4;
}

message TeamMember {
  uint64 entity_id = 1;
  string name = 2;
  uint32 level = 3;
}

message TeamSelf {               // G2C_TEAM_SELF: PLAYER_SEND_SELF_TEAM_INFO - the whole team of the receiver, or in_team = false (s2c_teamleave)
  bool in_team = 1;
  int32 team_id = 2;
  int32 state = 3;               // 1 open, 0 closed
  bool captain = 4;              // the receiver leads it
  TeamMember leader = 5;
  repeated TeamMember members = 6;
  uint32 lead_level = 7;         // the receiver's leadership level (Player+0x5970)
  uint64 lead_exp = 8;
  int32 members_max = 9;         // KTeam::CalcCaptainPower: what the captain's leadership allows
}

enum TeamEventKind {
  TEAM_EV_NONE = 0;
  TEAM_EV_CREATE_OK = 1;         // 0x69 sub 4 {team id, camp}
  TEAM_EV_CREATE_FAIL = 2;       // 0x69 sub 5 {error}: arg = the error (0 in a team already, 4 cannot create, 2 no free team)
  TEAM_EV_ADD_MEMBER = 3;        // s2c_teamaddmember: entity_id / name / level of the newcomer
  TEAM_EV_LEAVE = 4;             // s2c_teamleave {npc}: entity_id left (the receiver itself when its team is gone)
  TEAM_EV_KICK = 5;              // enumMSG_ID_TEAM_KICK_One: name
  TEAM_EV_CHANGE_CAPTAIN = 6;    // s2c_teamchangecaptain {new, old}: entity_id = the new captain, arg = 1 when the receiver is it
  TEAM_EV_OPEN_CLOSE = 7;        // s2c_teamopenclose: arg = 1 open / 0 closed
  TEAM_EV_INVITE = 8;            // s2c_teaminviteadd: entity_id / name of the captain inviting the receiver
  TEAM_EV_APPLY = 9;             // s2c_teamgetapply: entity_id / name / level of the applicant (to the captain)
  TEAM_EV_INFO = 10;             // s2c_teaminfo: leader + members of the team asked about
  TEAM_EV_INFO_FALSE = 11;       // s2c_teamapplyinfofalse
  TEAM_EV_DISMISS = 12;          // enumMSG_ID_TEAM_DISMISS
  TEAM_EV_REFUSE = 13;           // enumMSG_ID_TEAM_REFUSE_INVITE: name refused the invitation
  TEAM_EV_MSG = 14;              // a 0x86 message: arg = its id, the client's stringtable_core key (docs/CLIENT-2.0.md §21): 6 / 7 change-captain
                                 // fails, 0x12 / 0x13 MSG_TEAM_TARGET_CANNOT_ADD_TEAM, 0x24..0x28 MSG_TEAM_ERROR01..05 (a captain the system appointed)
  TEAM_EV_SELF_ADD = 15;         // enumMSG_ID_TEAM_SELF_ADD: the receiver joined
}

// ---- trade (docs/LINUX-SERVER.md §18): KTrade Player+0x5910 and KPlayerMenuState Player+0x5700 of jx_linux_y ----

enum TradeCmd {
  TRADE_CMD_NONE = 0;
  TRADE_APPLY_OPEN = 1;          // KPlayer::TradeApplyOpen 0x080AE590 {sentence}: the menu state TRADEOPEN (2) - others may ask
  TRADE_APPLY_CLOSE = 2;         // the 0x6a packet 0x080AE320: back to NORMAL
  TRADE_APPLY_START = 3;         // the 0x6b packet 0x080B4DE0 {npc}: ask a player whose state is TRADEOPEN
  TRADE_REPLY = 4;               // c2sTradeReplyStart 0x080BAFD0: target = the applicant, flag 1 accept / 0 refuse
  TRADE_MONEY = 5;               // the 0x6c packet 0x080AE510 {money}: the money put on the table
  TRADE_DECISION = 6;            // the 0x6d packet 0x080B2C70 {decision}: 0 cancel, 1 ok, 2 lock, 3 / 4 sync only
}

message TradeReq {               // C2G_TRADE
  TradeCmd cmd = 1;
  uint64 target = 2;             // the npc (entity id) the command is about
  int32 arg = 3;                 // the flag / money / decision
  string text = 4;               // TRADE_APPLY_OPEN: the sentence over the head (up to 255 bytes)
  uint32 seq = 5;
}

message TradeState {             // G2C_TRADE_STATE (the 0x76 sync to oneself)
  uint32 state = 1;              // 0 normal, 1 open for trade, 2 trading
  uint64 partner = 2;            // state 2: the partner's entity id
  string partner_name = 3;
}

message TradeSync {              // G2C_TRADE_SYNC: the four flags of the 0x81 packet, the partner's money of the 0x77 packet
  bool self_lock = 1;
  bool dest_lock = 2;
  bool self_ok = 3;
  bool dest_ok = 4;
  uint32 dest_money = 5;
  uint32 self_money = 6;
}

message TradeItem {              // G2C_TRADE_ITEM: the partner put an item on the table (removed = false) or took it back
  ItemView item = 1;             // the item as it lies in the partner's trade box (room 2, its x / y)
  bool removed = 2;
}

message TradeApply {             // G2C_TRADE_APPLY: the 0x8b packet {player, npc}
  uint64 entity_id = 1;
  string name = 2;
}

message TradeEnd {               // G2C_TRADE_END: the 0x78 packet {byte ok}
  bool ok = 1;
}

message SysMsg {                 // G2C_SYS_MSG: the 0x86 packet - id keys stringtable_core.txt (0xb / 0xc room full, 0xd refused, 0x2c cannot trade, ...)
  uint32 id = 1;
  uint64 entity_id = 2;
  string name = 3;
}

message EntityMenuState {        // G2C_ENTITY_MENU_STATE: s2c_npcsetmenustate around a player
  uint64 entity_id = 1;
  uint32 state = 2;              // PLAYER_MENU_STATE_*: 0 normal, 1 team open, 2 trade open, 3 trading, 4 idle
  string sentence = 3;           // state 2: what the player wrote
}

message TeamEvent {              // G2C_TEAM_EVENT
  TeamEventKind event = 1;
  uint64 entity_id = 2;
  string name = 3;
  uint32 level = 4;
  int32 arg = 5;
  TeamMember leader = 6;
  repeated TeamMember members = 7;
}

// KNpc::SetCamp 0x0807B7B0 (the 0x59 packet of the old game): a npc's camp (m_Camp) changed - a player joined or left a faction
message EntityCamp {             // G2C_ENTITY_CAMP
  uint64 entity_id = 1;
  int32 camp = 2;               // m_Camp (+0x21c; the 0x59 packet)
  int32 current_camp = 3;       // m_CurrentCamp (+0x220; SetCurrentCamp 0x0807B850, the 0x58 packet)
  int32 tmp_camp = 4;           // +0x1900 (Lua SetTmpCamp -> KNpc 0x0807B2D0, the 0xd1 packet {npc, camp}: to the player itself, else
                                // to the watchers); the client does not read it yet
}

// KPlayer::SetFaction 0x080AEEC0 (the 0x7b packet: camp, current faction, last added, times joined) and KPlayer::ClearFaction
// 0x080AEDE0 (the 0x7c packet: the current faction becomes -1, the camp 4 = C_FREE); the client's skill book takes the branch
// pages of faction_last (GDI 0x413 reads PlayerData+0x12080)
message PlayerFaction {          // G2C_PLAYER_FACTION
  int32 camp = 1;
  int32 faction = 2;             // -1 = none
  int32 faction_last = 3;
  uint32 faction_count = 4;
}

// one attribute a skill's state applies (KMagicAttrib: id + three values) - the 16 byte cells of the 0x87 packet
message StateAttrib {
  int32 type = 1;
  int32 v0 = 2;
  int32 v1 = 3;
  int32 v2 = 4;
}

// KNpc::SetStateSkillEffect 0x08086260 (the 0x87 packet, to the player itself: {npc id, skill, level, time, byte, n x
// state cells}) and RemoveStateSkillEffect 0x0807D310 (the same with level 63, time 0 and no cells = removed): a timed
// state of a skill on the character - the skill state list of the 2.0 client (技能状态列表.ini) shows its icon and time
message EntityState {            // G2C_ENTITY_STATE
  uint64 entity_id = 1;
  uint32 skill_id = 2;
  uint32 level = 3;
  int32 time = 4;                // frames left (18 a second), -1 = until removed
  uint32 special_id = 5;         // KSkill::StateSpecialId
  bool removed = 6;
  repeated StateAttrib states = 7;
}

message SkillDescAttrib {        // one KMagicAttrib of a skill level, named as the tables spell it (magic_attrib_name)
  int32 group = 1;               // 0 immediate, 1 damage, 2 state - the order KSkill::GetDescAboutLevel prints them
  string name = 2;
  int32 v0 = 3;
  int32 v1 = 4;
  int32 v2 = 5;
}

message SkillDescAppend {        // addskilldamage 1 to 6 of the level: "Tang cho ky nang <name>: <value> percent"
  int32 skill_id = 1;
  int32 value = 2;
}

message SkillDescRelated {       // a skill named inside a level's lines by 0x006F7F70 of the 2.0 client (docs/CLIENT-2.0.md 10.1)
  int32 skill_id = 1;
  int32 level = 2;               // the instance described: min(held, listed) of an append skill; EventSkillLevel or the level itself of an event skill
  int32 flags = 3;               // the flags of 0x006F7F70: 1 = no "Chieu N:" prefix, 2 = no name, 4 = no "[Cap N]"
  repeated SkillDescAttrib attribs = 4;   // its three attribute groups (0x006F82F0); its own related skills follow in the list (0x006FAA00 recurses)
}

message SkillDescLevel {         // what the level script left in the KSkill of one level
  uint32 level = 1;
  int32 cost = 2;                // CostValue after skill_cost_v
  int32 cost_type = 3;           // 0 mana, 1 stamina, 2 life
  int32 attack_radius = 4;
  repeated SkillDescAttrib attribs = 5;
  repeated SkillDescAppend appends = 6;
  repeated SkillDescRelated related = 7;   // in print order: the append skills held (skill_appendskill), then the event skills ShowEvent names
}

message EntityStateIcons {       // G2C_STATE_ICONS: the 0x7a packet {0x7a, 6 icon bytes, npc id} of KNpc 0x08079F60 - the six StateSpecialId icons
  uint64 entity_id = 1;          // over an npc (an aura's, the states'; a player's are blank unless its sync_aura), sorted by priority toward the end
  repeated uint32 icons = 2;     // six cells, 0 = empty
}

message MissleSync {             // G2C_MISSLE: a KMissle of the zone as KMissle::Paint / KMissleRes::Draw of the old client draw it
  uint32 index = 1;              // the slot of KMissleSet: the key of a missile while it lives
  uint32 missle_id = 2;          // the row of missles.txt (AnimFile*, LoopPlay, Sub*, MultiShow)
  uint32 skill_id = 3;
  uint32 level = 4;
  uint64 launcher = 5;
  int32 x = 6;                   // scene units (the cell * 32 + the offset / 1024)
  int32 y = 7;
  int32 z = 8;                   // m_nCurrentMapZ (the height >> 10)
  uint32 dir = 9;                // 0 to 63
  int32 x_factor = 10;           // the flight vector, x1024 per unit of speed
  int32 y_factor = 11;
  int32 speed = 12;              // units a frame
  int32 life_time = 13;          // frames, the start delay included
  int32 start_life_time = 14;
  int32 current_life = 15;       // frames since creation when this was sent
  uint32 status = 16;            // 0 wait, 1 fly, 2 vanished
  bool removed = 17;             // the slot is freed: the vanish movie, then nothing
  uint32 move_kind = 18;
  bool collided = 19;            // a blow landed this frame at (x, y): the collision movie (AnimFile4) plays there (KMissle::DoCollision)
  int32 height = 20;             // m_nHeight (MissleHeight << 10, 1/1024 units): z = height >> 10; the client climbs between syncs
  int32 height_speed = 21;       // m_nHeightSpeed (Zspeed, or the climb of a MoveKind 7 missile): height += it each frame
  int32 z_acceleration = 22;     // m_nZAcceleration (Zacc): height_speed -= it each frame; not 0 = drawn facing its vector (KMissle::Paint 1531)
}

message SkillDesc {              // G2C_SKILL_DESC
  uint32 skill_id = 1;
  bool with_cur = 2;             // cur is filled (a bool of its own: the C++ generator owns has_cur())
  SkillDescLevel cur = 3;        // the level asked for (1 to the max level)
  bool with_next = 4;
  SkillDescLevel next = 5;       // the level after it, when there is one
  uint32 max_level = 6;
  int32 level_inc = 7;           // the increments of the skill list on the level shown (0x006233B0 with - 0x00623380 without): G_Skills_38 "Cap hien tai: %d (%d+%d)" when not 0
  int32 enhance = 8;             // KSkillList::enhance[skill] (+0xf14 of the 2.0 list, the addskilldamage of the skills held): G_Skills_39 when not 0
  uint32 held_level = 9;         // the level the zone described as the current one (the list's current level, increments included)
  int32 equip_percent = 10;      // the asker's magicdamage_p (244, +0x1284; the 2.0 client's Npc+0x1148): G_Skills_76 "Trang bi gom co: %d%%" when the
                                 // skill's Attrib is a [SkillType] 1 / 2 (the client's +0x1278 part comes from its attribute 299
                                 // movedistanc_710_enhance, which this jx_linux_y build does not have)
  bool with_modifier = 11;       // the asker's state modifier (KNpc+0x19d8, the client's Player+0x12ac8) aims at this skill: G_Skills_76 + its line
  SkillDescAttrib modifier = 12; // that attribute (index / delta as one KMagicAttrib), described by [Descript] (0x005EC4F0 -> KMagicDesc::GetDesc)
}

// The player was moved to another map (KNpc::ChangeWorld across subworlds on the old server).
// The client drops every entity, loads the bundle and waits for the EntitySpawn of the new
// surroundings (which includes the player itself).
message ChangeMap {
  uint32 map_id = 1;
  Vec2 pos = 2;
  uint32 scene_w = 3;
  uint32 scene_h = 4;
  uint64 entity_id = 5;          // the player's entity in the new map
}

message ChatMsg {
  uint64 entity_id = 1;
  string name = 2;
  string text = 3;
  ChatChannel channel = 4;
}

message Ping {
  uint64 client_ms = 1;
}

message Pong {
  uint64 client_ms = 1;
  uint64 server_ms = 2;
  uint64 tick = 3;
}

message Kick {
  Result reason = 1;
  string text = 2;
}

// ---- common.proto ----
// Shared scalar types.  Package jx.pb is used by every file so the three generators
// (C++ jx::pb, Go jxpb, GDScript) see one namespace.

// World position in integer units (old game: 1 cell = 32 units, one map ~ 10k x 10k units).
message Vec2 {
  int32 x = 1;
  int32 y = 2;
}

enum Result {
  RESULT_OK = 0;
  RESULT_INTERNAL_ERROR = 1;
  RESULT_BAD_REQUEST = 2;
  RESULT_UNAUTHORIZED = 3;
  RESULT_NOT_FOUND = 4;
  RESULT_ALREADY_EXISTS = 5;
  RESULT_FULL = 6;
  RESULT_INVALID_NAME = 7;
  RESULT_WRONG_STATE = 8;
  RESULT_ZONE_UNAVAILABLE = 9;
  RESULT_VERSION_MISMATCH = 10;
  // login results of the old Sword3PaySys / Bishop (LoginDef.h LOGIN_R_*, S3PAccount::Login)
  RESULT_ACCOUNT_IN_USE = 11;    // LOGIN_R_ACCOUNT_EXIST: the account is logged in elsewhere
  RESULT_ACCOUNT_FROZEN = 12;    // LOGIN_R_FREEZE: frozen by a GM
  RESULT_NO_GAME_TIME = 13;      // LOGIN_R_TIMEOUT / E_ACCOUNT_NODEPOSIT: no game time left
  RESULT_SERVER_BUSY = 14;       // LOGIN_R_FAILED: too many failed logins, try again later
  // session protection (new in JX NEXT)
  RESULT_RATE_LIMITED = 15;      // the client sent more than the gateway allows
  RESULT_TIMEOUT = 16;           // no heartbeat within the allowed time
  RESULT_REPLACED = 17;          // LOGIN_R_BEDISCONNECTED: the account logged in from elsewhere
  RESULT_SERVER_SHUTDOWN = 18;   // LL_R_SERVER_SHUTDOWN: the gateway is going down
}

enum EntityType {
  ENTITY_UNKNOWN = 0;
  ENTITY_PLAYER = 1;
  ENTITY_NPC = 2;
  ENTITY_MONSTER = 3;
  ENTITY_DROP = 4;
}

// ---- internal.proto ----
// Gateway <-> zone messages (never sent to clients).


message ZoneHello {
  uint32 protocol_version = 1;
  string gateway_id = 2;
}

message ZoneHelloAck {
  uint32 protocol_version = 1;
  uint32 zone_id = 2;
  string zone_name = 3;
  uint32 tick_hz = 4;
  uint32 capacity = 5;
  uint32 map_id = 6;             // asset bundle id (client/assets/maps/<map_id>), 0 = no map
  uint32 scene_w = 7;            // map size in scene units
  uint32 scene_h = 8;
  // The high bits every session id of this gateway must carry.  A zone in front of several
  // gateways would otherwise see session 1 of each of them as the same session: the second one
  // silently replaced the first, and half the players never reached the world.  The zone hands
  // out one prefix per gateway link.
  uint64 session_prefix = 9;
}

// Gateway asks the zone to spawn a player for a client session.
message SessionOpen {
  uint64 sid = 1;
  uint64 account_id = 2;
  RoleData role = 3;
  string account = 4;   // the account's name: Player+0x264 of jx_linux_y, what Lua GetAccount 0x0810F6A0 answers
}

message SessionOpenAck {
  uint64 sid = 1;
  Result result = 2;
  uint64 entity_id = 3;
  Vec2 pos = 4;
  uint32 map_id = 5;             // the map the player spawned in (a zone hosts several)
  uint32 scene_w = 6;
  uint32 scene_h = 7;
}

message SessionClose {
  uint64 sid = 1;
  uint32 reason = 2;             // 0 = client left, 1 = timeout, 2 = kicked, 3 = gateway shutdown
}

// A client message forwarded to the zone verbatim.
message ClientPacket {
  uint64 sid = 1;
  uint32 msg_id = 2;
  bytes payload = 3;
}

// A message from the zone to one or many client sessions (fan-out done by the gateway).
message ZonePacket {
  repeated uint64 sids = 1;
  uint32 msg_id = 2;
  bytes payload = 3;
}

// Zone -> gateway: persist the player (periodic and on SessionClose).
message PlayerSave {
  uint64 sid = 1;
  RoleData role = 2;
  bool final = 3;                // true when the player has left the zone
  uint64 tick = 4;               // the zone tick the snapshot was taken at (saves are spread over ticks)
}

message ZoneStats {
  uint32 zone_id = 1;
  uint64 tick = 2;
  uint32 players = 3;
  uint32 entities = 4;
  uint32 tick_ms_avg = 5;
  uint32 tick_ms_max = 6;
}

// ---- msg.proto ----
// Message id registry.  Every frame on the wire carries one of these ids (see docs/PROTOCOL.md).
//   1000-1999  C2G   client -> gateway
//   2000-2999  G2C   gateway -> client
//   9000-9999  internal gateway <-> zone
// Never reuse a number.  Ids marked (zone) are forwarded by the gateway to the zone as ClientPacket.

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_VERSION = 1;
}

enum MsgId {
  MSG_NONE = 0;

  // client -> gateway
  C2G_HELLO = 1001;
  C2G_LOGIN = 1002;
  C2G_CHAR_LIST = 1003;
  C2G_CHAR_CREATE = 1004;
  C2G_ENTER_WORLD = 1005;
  C2G_LEAVE_WORLD = 1006;
  C2G_PING = 1007;
  C2G_MOVE = 1101;             // (zone)
  C2G_CHAT = 1102;             // (zone)
  C2G_ATTACK = 1103;           // (zone)
  C2G_ITEM_MOVE = 1104;        // (zone) an item to another cell / room
  C2G_ITEM_EQUIP = 1105;       // (zone) wear an item from the bag
  C2G_ITEM_UNEQUIP = 1106;     // (zone) take a worn item off into the bag
  C2G_ITEM_USE = 1107;         // (zone) eat a medicine / use an item
  C2G_ITEM_DROP = 1108;        // (zone) throw an item away: it lies on the ground for a while
  C2G_PICK_UP = 1109;          // (zone) pick up an item / money from the ground
  C2G_ADD_POINT = 1110;        // (zone) spend attribute points (KPlayer::AddBaseStrength.. of the old c2s_playeraddattribute)
  C2G_ADD_SKILL_POINT = 1111;  // (zone) spend skill points on a skill (KPlayer::AddSkillPoint)
  C2G_CAST_SKILL = 1112;       // (zone) cast a skill at a target or a spot (NpcSkillCommand -> KNpc::SendCommand(do_skill))
  C2G_REVIVE = 1113;           // (zone) a dead character asks to revive at its revive point (the handler slot 118 -> KPlayer::Revive(0))
  C2G_RIDE = 1114;             // (zone) mount / dismount the worn horse (0x080AEFA0 -> KNpc::SetHorse 0x0807D520)
  C2G_SKILL_DESC = 1115;       // (zone) the numbers of a skill level for its tip (KSkill::GetDesc 0x006FBC90 of the 2.0 client runs the level script; the zone answers)
  C2G_SET_AURA = 1116;         // (zone) the aura switched on: the 0x6f packet of KNpc::SetAura 0x005EA870 (the right-mouse skill is an aura) -> handler cell 111 0x080DC460 -> KNpc::SetAura 0x08087290
  C2G_SIT = 1117;              // (zone) sit down / stand up: the 0x71 packet -> handler cell 113 0x080DC300 -> 0x08078AA0(npc, 8 / 1)
  C2G_PK_STATE = 1118;         // (zone) the PK switch: the 0x76 packet {byte state} -> 0x080DBE00 -> KPlayerPK::SetPKState 0x080C3740
  C2G_TEAM = 1119;             // (zone) a team command: the 0x53 packet {0x53, word len, byte sub 1..11, dword npc} of jx_linux_y (docs/LINUX-SERVER.md §17)
  C2G_TRADE = 1120;
  C2G_NPC_DIALOG = 1121;       // (zone) the 0x6e packet {0x6e, dword npc id, dword sync}: KPlayer::DialogNpc 0x080B1300 (docs/LINUX-SERVER.md §20)
  C2G_SCRIPT_INPUT = 1125;     // (zone) the 0x82 packet: the answer to AskClientForNumber (kind 3 {int}) / AskClientForString (kind 2 {word len, text}) (0x080DB490 -> 0x081F6830; docs/LINUX-SERVER.md §29)
  C2G_GIVE_ITEMS = 1124;       // (zone) the 0x89 packet {0x89, word size, int kind, int count, {room, x, y, cell x, cell y}[count]}: the give-item box of GiveItemUI (0x080DB680 -> 0x080AC560; docs/LINUX-SERVER.md §27)
  C2G_TASK_VALUE = 1123;       // (zone) the 0xaa packet {0xaa, int id, int value} (0x080DB070): a CLIENT_FLAG value of player_task_def.txt set by the client (docs/LINUX-SERVER.md §21)
  C2G_DIALOG_ANSWER = 1122;    // (zone) the 0x5f packet {0x5f, int index, int kind, int, int}: the answer of a Say / Talk (0x080AC5D0)            // (zone) a trade command: the trade packets of jx_linux_y (apply open / close / start, reply, money 0x6c, decision 0x6d; docs/LINUX-SERVER.md §18)

  // gateway -> client
  G2C_HELLO_ACK = 2001;
  G2C_LOGIN_RES = 2002;
  G2C_CHAR_LIST_RES = 2003;
  G2C_CHAR_CREATE_RES = 2004;
  G2C_ENTER_WORLD_RES = 2005;
  G2C_PONG = 2007;
  G2C_KICK = 2008;
  G2C_ENTITY_SPAWN = 2101;
  G2C_ENTITY_DESPAWN = 2102;
  G2C_ENTITY_MOVE = 2103;
  G2C_CHAT_MSG = 2104;
  G2C_ENTITY_ACTION = 2105;    // attack / hurt / death / revive (old NPC_HURT_SYNC, NPC_DEATH_SYNC, skill sync)
  G2C_ENTITY_LIFE = 2106;
  G2C_CHANGE_MAP = 2107;       // the zone moved the player to another map (NewWorld of a trap script)
  G2C_ENTITY_MOVES = 2108;     // several EntityMove in one frame: what moved far from the receiver, every few ticks (N3)
  G2C_ITEM_LIST = 2109;        // everything the character carries, on entering the world
  G2C_ITEM_ADD = 2110;         // a new item, or a stack that changed (same id, new count)
  G2C_ITEM_REMOVE = 2111;      // an item is gone (used up, dropped)
  G2C_ITEM_MOVE = 2112;        // an item lies somewhere else now (also the answer to C2G_ITEM_MOVE / EQUIP / UNEQUIP)
  G2C_ITEM_RESULT = 2113;      // a request that changed nothing, with why
  G2C_MONEY = 2114;            // money in the bag and the repository
  G2C_PLAYER_ATTRIB = 2115;    // the character's own numbers (CURPLAYER_SYNC + PLAYER_ATTRIBUTE_SYNC + PLAYER_LEVEL_UP_SYNC of the old game)
  G2C_SKILL_LIST = 2116;       // every skill the character holds (s2c_synccurplayerskill)
  G2C_SKILL_LEVEL = 2117;      // one skill's level / experience / the skill points left (the 0x5e packet)
  G2C_SKILL_FORBID = 2118;     // a skill (or all) locked or freed (the 0x63 packet)
  G2C_ENTITY_RIDE = 2119;      // a npc mounted or dismounted (the 0x20 flag of the old 0x4c / 0x4d sync)
  G2C_ENTITY_CAMP = 2120;      // a npc's camp changed (the 0x59 packet)
  G2C_PLAYER_FACTION = 2121;   // the character's faction record (the 0x7b packet; 0x7c = cleared)
  G2C_ENTITY_STATE = 2122;     // a skill's timed state on the character (the 0x87 packet; empty = removed)
  G2C_SKILL_DESC = 2123;       // the answer to C2G_SKILL_DESC: cost / range / attributes of the level shown and of the next one
  G2C_MISSLE = 2124;           // a missile of a cast: born, flying (a position every 6 frames), gone - the client draws it (the 2.0 client re-runs CastMissles from the 0x5a packet instead)
  G2C_STATE_ICONS = 2125;      // the 0x7a packet (0x08079F60): the six state icons over an npc, sent when they changed (aura, states)
  G2C_NPC_GOLD = 2126;         // the 0x9a packet (0x0809DF66): a monster turned gold - its kind (NpcGoldTemplate row + 1)
  G2C_ENTITY_RES = 2127;       // the 0xad packet (0x0807A9D0): a player's equipment look (helm / armour / weapon / horse / mantle rows)
  G2C_PK_STATE = 2128;         // the 0x90 / 0x93 packets: the character's own PK state and value
  G2C_ENTITY_PK = 2129;        // a player's PK state for the others (the flag & 3 of the 0x4b sync)
  G2C_TEAM_SELF = 2130;        // one's own team as it stands (s2c_teamselfinfo: the 0x69 packet of KPlayer::SendSelfTeamInfo 0x080AA7F0)
  G2C_TEAM_EVENT = 2131;       // a team happening (the other 0x69 sub-commands and the 0x86 team messages)
  G2C_TRADE_STATE = 2132;      // s2c_tradechangestate (KPlayerMenuState::SetState 0x080C29D0): 0 normal, 1 open for trade, 2 trading {partner}
  G2C_TRADE_SYNC = 2133;       // the 0x81 packet of SyncTradeState 0x080A85B0 {self lock, dest lock, self ok, dest ok} + the 0x77 money of the partner
  G2C_TRADE_ITEM = 2134;       // the partner's trade box: an item put there (the 0xcc-byte sync of ExchangeItem 0x08206110) or taken back
  G2C_TRADE_APPLY = 2135;      // the 0x8b packet (0x080B4DE0): somebody asks to trade with the receiver
  G2C_TRADE_END = 2136;        // the 0x78 packet: the trade is over {ok = the exchange happened, 0 = cancelled}
  G2C_SYS_MSG = 2137;          // the 0x86 packet {word 8, word id, dword npc}: a sentence of stringtable_core.txt by id (docs/CLIENT-2.0.md §21)
  G2C_ENTITY_MENU_STATE = 2138;
  G2C_TASK_VALUE = 2140;       // the 0xa7 packet {0xa7, int id, int value} of KPlayer::SetTaskValue 0x080A9190 / SyncTaskValue (0x080A8CC0) -> the client's 0x006512F0 (docs/LINUX-SERVER.md §21)
  G2C_TASK_VALUES = 2141;      // the 0xb5 packet of SyncTaskValueMore 0x080A9550: up to eighty {id, value} (the client's 0x00651350)
  G2C_SCRIPT_ASK = 2144;       // the 0xa3 packet {0xa3, word 0x4c, 2, kind, title[0x20], int min, int max, default[0x20]} of Lua AskClientForNumber 0x08115CA0 / AskClientForString 0x08115E90 (docs/LINUX-SERVER.md §29)
  G2C_GIVE_ITEM_MSG = 2143;    // the 0xd8 / 0xdf packets of Lua SetUiGiveItemMsg 0x0810B020 / SetUiGiveItemMoreConfirmMsg 0x0810AF50: a sentence for the give-item window (docs/LINUX-SERVER.md §27)
  G2C_TASK_TIP = 2142;         // the 0xb6 packet of Lua TaskTip 0x08122730 {0xb6, 0x10, text[0x3e]} -> the client's 0x00651390 -> ui message 0x5d -> the system message pane (系统消息.ini) (docs/LINUX-SERVER.md §25)
  G2C_SCRIPT_ACTION = 2139;    // the 0x63 packet PLAYER_SCRIPTACTION_SYNC: Say (a sentence + answers) / Talk (pages) of a npc script (docs/LINUX-SERVER.md §20)   // s2c_npcsetmenustate: the sign over a player's head (1 looking for team mates, 2 trading wanted + sentence, 3 trading)

  // gateway <-> zone
  GZ_ZONE_HELLO = 9001;
  ZG_ZONE_HELLO_ACK = 9002;
  GZ_SESSION_OPEN = 9003;
  ZG_SESSION_OPEN_ACK = 9004;
  GZ_SESSION_CLOSE = 9005;
  GZ_CLIENT_PACKET = 9006;
  ZG_ZONE_PACKET = 9007;
  ZG_PLAYER_SAVE = 9008;
  ZG_ZONE_STATS = 9009;
}

// ---- role.proto ----
// Persistent character data ("RoleData").  This is the model every layer agrees on:
// persist stores it, the zone loads/saves it, the client receives a projection of it.
// Add fields freely; never renumber or reuse a tag.


message RolePosition {
  uint32 zone_id = 1;   // logical zone id
  Vec2 pos = 2;
  uint32 map_id = 3;    // map bundle within the zone (0 = the zone's default map)
}

// The character's own numbers, the way TRoleData of the JX2 server keeps them (KPlayer::LoadFrom,
// docs/LINUX-SERVER.md §10): hp_max / mp_max are the BASE maxima (m_LifeMax / m_ManaMax: levels
// and attribute points, before equipment); stamina_max is recomputed from the level tables; the
// five points are the base points (m_nStrength.. the player put there), the current ones are
// derived every time the zone recalculates.
message RoleStats {
  int32 hp = 1;
  int32 hp_max = 2;
  int32 mp = 3;
  int32 mp_max = 4;
  int32 stamina = 5;
  int32 stamina_max = 6;
  int32 strength = 7;
  int32 dexterity = 8;
  int32 vitality = 9;
  int32 energy = 10;
  int32 move_speed = 11;    // units per second
  int32 lucky = 12;         // m_nLucky
  int32 attribute_point = 13;   // m_nAttributePoint: unspent (5 per level)
  int32 skill_point = 14;       // m_nSkillPoint: unspent (1 per level)
  uint32 reborn = 15;       // times reborn (KPlayer+0x86b8, <= 7): picks the experience table
  uint32 camp = 16;         // m_Camp (BaseInfo.iteam)
  // KPlayer+0x44..+0x60 of jx_linux_y: the eight extension points the scripts keep (GetExtPoint 0x0810FA90 / AddExtPoint
  // 0x0810FBE0 / PayExtPoint 0x0810FCA0 / AddExtPointForGS 0x0810FB20 -> KPlayer 0x080AB090 / 0x080AB100); index 0 is the
  // ticket count of the scripts (EXTPOINT_TICKET_NEW = 0)
  repeated int32 ext_point = 17;
}

// One attribute of an item (KMagicAttrib of the old core): a type and up to three parameters.
message ItemMagic {
  uint32 type = 1;
  repeated int32 value = 2;   // 3 values
}

// One item a character holds (KItem + its place in KItemList; docs/OLD-TO-NEW.md).  What made
// the item is kept (version, genre/detail/particular/level, gen_param) so its table row can be
// found again, and what was rolled for it (base attributes, magic) so it never re-rolls.
message ItemData {
  uint32 id = 1;              // unique within the character, never reused
  uint32 version = 2;         // the item table set it was made from (settings/item/000..)
  uint32 genre = 3;           // ITEMGENRE
  uint32 detail = 4;
  uint32 particular = 5;
  uint32 level = 6;
  int32 series = 7;           // -1 = none
  uint32 count = 8;           // stack
  int32 durability = 9;       // -1 = never wears
  uint32 ex_type = 10;        // 0 normal, 1 gold, 2 platina, 3 purple
  uint32 gen_param = 11;      // gold: row id; script item: row
  uint32 group = 12;          // gold: the set
  uint32 ex_group = 13;
  uint32 group_serial = 14;
  repeated ItemMagic base = 15;
  repeated ItemMagic require = 16;
  repeated ItemMagic magic = 17;
  repeated ItemMagic magic_ex = 18;
  uint32 room = 19;           // KItemRoom: 0 bag, 1 repository, 2 trade, 3 quick slots, 10 worn (x = part)
  uint32 x = 20;
  uint32 y = 21;
  uint32 rand_seed = 22;      // KItem+0x1e0: the seed of the roll (ITEM_GetItemRandSeed; AddItemEx with a seed rolls the same piece again)
  repeated int32 magic_level = 23;   // KItem+0x1e4..: the six levels of the roll (SetItemMagicLevel writes one)
  uint32 luck = 24;           // KItem+0x200: the luck of the roll (GetItemProp)
  int32 bind_state = 25;      // KItem+0x350: SetItemBindState / GetItemBindState (0 = free; the bag scans skip a bound piece)
  uint32 expire_time = 26;    // KItem+0x34c: ITEM_SetExpiredTime (unix seconds, 0 = never)
}

// One skill of the character's KSkillList (jx_linux_y 0x080E48D0 writes {int16 id, int16 level,
// int32 exp}, KPlayer::LoadPlayerFightSkillList 0x080C0240 reads it back through KSkillList::Add);
// cells that live on increments only are not saved.
message RoleSkill {
  uint32 id = 1;
  uint32 level = 2;
  uint32 exp = 3;
}

// One saved task value of the character (KPlayerTask of the old core, the std::map at Player+0x809c+0x54c of jx_linux_y;
// KPlayer::SavePlayerTaskList 0x080BF1C0 writes the non-zero {int id, int value} pairs into TRoleData, LoadPlayerTaskList
// 0x080C0050 reads them back through SetSaveVal).  The temp values (m_nTaskTemp) are never saved.
message RoleTaskValue {
  uint32 id = 1;              // 0..0x176f
  int32 value = 2;            // never 0 (a 0 erases the entry)
}

// One event a script registered on the character (KPlayerEvent, Player+0x8064 of jx_linux_y: {word id, word count};
// the extra block of TRoleData keeps them, 0x080BEB60): AddPlayerEvent, counted by the kills of event_killnpc.txt
message RolePlayerEvent {
  uint32 id = 1;
  uint32 count = 2;           // the kills so far
}

message RoleData {
  uint64 player_id = 1;
  uint64 account_id = 2;
  string name = 3;          // UTF-8, validated by the auth/persist layer
  uint32 level = 4;
  uint64 exp = 5;
  uint32 series = 6;        // five elements (metal, wood, water, fire, earth) as in the old game
  uint32 sex = 7;
  int32 faction = 8;        // KPlayerFaction::m_nCurFaction (KPlayer+0x59cc; cFaction of the DB record): 0..10, -1 = none
  RolePosition position = 9;
  RoleStats stats = 10;
  repeated ItemData items = 11;   // (RoleItem, the placeholder that stood here, was never written by anyone)
  uint64 created_at_ms = 12;
  uint64 last_login_ms = 13;
  uint64 play_time_s = 14;
  // Shape of this record.  persist.CurrentRoleVersion is what the running server writes; an
  // older record is upgraded on load (persist.MigrateRole), a newer one is refused instead of
  // being silently downgraded.  See docs/ADR-003-role-data.md.
  uint32 data_version = 15;
  bool fight_mode = 16;     // KNpc::SetFightMode: in/out of combat stance (city gate traps)
  // Where the character was born (CharCreateReq.native_place, KRoleChiefInfo.NativePlaceId of the
  // old game): the map id of the starting village, the character's home for the revive rules.
  uint32 native_place = 17;
  uint32 next_item_id = 18;  // KItemList: the id the next item gets (ids never repeat within a character)
  uint32 money = 19;         // in the bag (KItemList room_equipment money)
  uint32 bank_money = 20;    // in the repository
  repeated RoleSkill skills = 21;   // the fight skill list (KSkillList; DBSkillData of the old server)
  // the revive point (KPlayer+0x20 map, +0x28 / +0x2c x, y: SetTempRevPos / SetRevPos): where KPlayer::Revive(0) puts
  // the character back; 0 = the spawn point of its map
  uint32 revive_map = 22;
  Vec2 revive_pos = 23;
  // the id of the revive point (KPlayer+0x14: the Bishop's irevivalx of a fresh character = one of its village's ids in
  // revivepos.ini, or SetRevPos(map, ref) later); the zone resolves it through revive_pos.json; 0 = none
  uint32 revive_ref = 24;
  // KPlayerFaction (Core/Src/KPlayerFaction.h; KPlayer+0x59cc..+0x59d8 of jx_linux_y): the faction last added (m_nLastAddFaction,
  // +0x59d4, the one the client's skill book shows the branches of) and how many times a faction was joined (m_nAddTimes,
  // +0x59d8: 0 = never, the name of a character without faction depends on it); m_nFirstAddFaction is not saved (LoadFrom 0x080C1A62)
  int32 faction_last = 25;
  uint32 faction_count = 26;
  // KPlayerPK (Player+0x5a50): the PK state 0..2 (the save 0x080BFCDD writes the byte), the PK value 0..10 (0x080BFCEF), the
  // ForbidChangePK lock
  uint32 pk_state = 27;
  uint32 pk_value = 28;
  bool pk_locked = 29;
  // the leadership (m_dwLeadExp +0x596c / m_dwLeadLevel +0x5970 of KPlayer): the level says how many a team led by the
  // character can hold (level_lead_exp.txt col 3, KTeam::CalcCaptainPower 0x080CC960); 0 = level 1
  uint64 lead_exp = 30;
  uint32 lead_level = 31;
  repeated RoleTaskValue task_values = 32;   // the task values the scripts keep (GetTask / SetTask; docs/LINUX-SERVER.md §21)
  repeated RolePlayerEvent events = 33;      // the kill events registered on the character (AddPlayerEvent; docs/LINUX-SERVER.md §23)
}

