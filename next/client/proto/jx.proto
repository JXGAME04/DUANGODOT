// GENERATED by tools/gen_proto.py from proto/jx/*.proto - do not edit.
syntax = "proto3";

// ---- client.proto ----
// Client <-> gateway messages.  C2G = client to gateway, G2C = gateway to client.
// Some C2G messages are forwarded unchanged to the zone (see MsgId comments in msg.proto).


// ---- handshake / auth ------------------------------------------------------------------

message Hello {
  uint32 protocol_version = 1;   // PROTOCOL_VERSION in msg.proto
  string client_version = 2;
  string platform = 3;           // "windows", "linux", "android", ...
  string device_id = 4;
}

message HelloAck {
  uint32 protocol_version = 1;
  uint64 server_time_ms = 2;
  string server_version = 3;
  uint64 sid = 4;                // session id, useful when reading logs
  string auth_mode = 5;          // "dev" (first login registers the account) or "strict" (registered accounts only)
  uint32 heartbeat_s = 6;        // the gateway drops a silent in-world session after this many seconds; ping more often
}

message LoginReq {
  string account = 1;
  string password = 2;           // dev auth only; real auth uses tokens (phase 3)
}

message LoginRes {
  Result result = 1;
  uint64 account_id = 2;
  string text = 3;               // human readable reason (field names must avoid protobuf keywords: godobuf)
}

// ---- characters ------------------------------------------------------------------------

message CharSummary {
  uint64 player_id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 series = 4;
  uint32 sex = 5;
  uint32 faction = 6;
  uint32 zone_id = 7;
}

message CharListReq {}

message CharListRes {
  Result result = 1;
  repeated CharSummary chars = 2;
  uint32 max_chars = 3;
}

message CharCreateReq {
  string name = 1;
  uint32 series = 2;
  uint32 sex = 3;
  // The starting village the player picked (KUiSelNativePlace): the Id of Settings/NativePlaceList.ini,
  // which is the map id of the village (53 Ba Lang Huyen, 20 Giang Tan Thon...).  0 = not chosen.
  uint32 native_place = 4;
}

message CharCreateRes {
  Result result = 1;
  CharSummary summary = 2;
}

message EnterWorldReq {
  uint64 player_id = 1;
}

message EnterWorldRes {
  Result result = 1;
  uint32 zone_id = 2;
  string zone_name = 3;
  uint64 entity_id = 4;          // the entity that belongs to this client in the zone
  Vec2 pos = 5;
  uint32 tick_hz = 6;
  uint32 map_id = 7;             // which map bundle to draw (0 = plain grid)
  uint32 scene_w = 8;
  uint32 scene_h = 9;
}

message LeaveWorldReq {}

// ---- world (zone) ----------------------------------------------------------------------

// Server authoritative movement: the client asks to move towards a target, the zone
// simulates and broadcasts EntityMove to everyone who can see the entity.
message MoveReq {
  Vec2 target = 1;
  uint32 seq = 2;                // client sequence number, echoed in EntityMove for the own entity
}

// Basic melee attack on a target (KNpc::DoAttack).  The zone repeats the swing until the target
// dies, the player moves or the target leaves reach.
message AttackReq {
  uint64 target = 1;
  uint32 seq = 2;
}

// KNpc::m_Doing as far as clients need it.
enum Action {
  ACTION_STAND = 0;
  ACTION_ATTACK = 1;             // frames = swing length in logic frames (18 Hz), dir = facing, target
  ACTION_HURT = 2;               // frames = hurt length (KNpc::DoHurt), pos = where the entity stands
  ACTION_DEATH = 3;              // frames = death animation; the corpse keeps the last frame until despawn
  ACTION_REVIVE = 4;
}

// An entity started an action (old NPC_HURT_SYNC / NPC_DEATH_SYNC / skill sync).
message EntityAction {
  uint64 entity_id = 1;
  Action action = 2;
  uint64 target = 3;
  uint32 dir = 4;
  uint32 frames = 5;
  Vec2 pos = 6;
  uint64 tick = 7;
}

// Life changed (damage / heal), sent to everyone who sees the entity.
message EntityLife {
  uint64 entity_id = 1;
  uint32 life = 2;
  uint32 life_max = 3;
  int32 delta = 4;               // negative = damage
  uint64 source = 5;
}

message EntityInfo {
  uint64 entity_id = 1;
  EntityType entity_type = 2;
  string name = 3;
  Vec2 pos = 4;
  Vec2 target = 5;               // where it is currently moving to (== pos when idle)
  uint32 move_speed = 6;
  uint32 level = 7;
  uint32 series = 8;
  uint32 sex = 9;
  uint32 template_id = 10;       // npc/monster template, 0 for players
  repeated Vec2 path = 11;       // remaining waypoints after pos (server pathfinding)
  uint32 dir = 12;               // facing direction 0..63 (old g_GetDirIndex: 0 = down, clockwise on screen)
  uint32 life = 13;
  uint32 life_max = 14;
  Action doing = 15;             // what it is doing right now (a corpse reports ACTION_DEATH)
  uint32 doing_frames = 16;
  uint32 count = 17;             // ENTITY_DROP: the stack of the item, or the coins of a money pile (template_id = ObjData row)
}

message PickUpReq {              // C2G_PICK_UP: take the thing on the ground into the bag (KPlayer::ServerPickUpItem)
  uint64 entity_id = 1;
  uint32 seq = 2;                // answered with G2C_ITEM_ADD / G2C_MONEY, or G2C_ITEM_RESULT with the reason
}

message EntitySpawn {
  repeated EntityInfo entities = 1;
}

message EntityDespawn {
  repeated uint64 entity_ids = 1;
}

message EntityMove {
  uint64 entity_id = 1;
  Vec2 pos = 2;                  // position at tick
  Vec2 target = 3;               // final destination (last waypoint), == pos when idle
  uint32 move_speed = 4;
  uint64 tick = 5;
  uint32 seq = 6;                // MoveReq.seq when this is the receiver own entity
  repeated Vec2 path = 7;        // waypoints from pos to target; the client follows the same line
}

// The movements of entities FAR from the receiver, gathered over a few ticks into one frame
// (KSubWorld::flush_far, N3).  Each entry is the entity's latest state, exactly what an EntityMove
// would carry; the client handles them one by one.  What moves near the receiver still comes as a
// single EntityMove the moment it happens.
message EntityMoves {
  repeated EntityMove moves = 1;
}

message ChatReq {
  string text = 1;
}

// ---- items (M11) ----

// One item as the client sees it: what the character holds (KItem) plus what its table row says
// (name, picture, size, price) so the bag window needs no table of its own.
message ItemView {
  uint32 id = 1;
  uint32 genre = 2;              // ITEMGENRE: 0 equipment, 1 medicine, 4 quest, 5 town portal, 6 script item
  uint32 detail = 3;
  uint32 particular = 4;
  uint32 level = 5;
  int32 series = 6;
  uint32 count = 7;
  int32 durability = 8;          // -1 = never wears
  int32 max_durability = 9;
  uint32 ex_type = 10;           // 0 normal, 1 gold, 2 platina, 3 purple
  uint32 room = 11;              // 0 bag, 1 repository, 2 trade, 3 quick slots, 10 worn (x = part)
  uint32 x = 12;
  uint32 y = 13;
  uint32 width = 14;             // cells
  uint32 height = 15;
  string name = 16;
  string image = 17;             // \spr\item\... of the old client
  string intro = 18;
  uint32 price = 19;
  repeated ItemMagic base = 20;
  repeated ItemMagic require = 21;
  repeated ItemMagic magic = 22;
  uint32 version = 23;           // the item table set it was made from (items/v00N.json): the tooltip's "[min-max]" ranges
}

message InventorySync {          // G2C_ITEM_LIST ("ItemList" is a Godot class, so not that name)
  repeated ItemView items = 1;
  uint32 money = 2;
  uint32 bank_money = 3;
}

message ItemAdd {                // G2C_ITEM_ADD
  ItemView item = 1;
}

message ItemRemove {             // G2C_ITEM_REMOVE
  uint32 id = 1;
}

message ItemMove {               // C2G_ITEM_MOVE (the wish) and G2C_ITEM_MOVE (what happened)
  uint32 id = 1;
  uint32 room = 2;
  uint32 x = 3;
  uint32 y = 4;
  uint32 seq = 5;
}

message ItemEquipReq {           // C2G_ITEM_EQUIP
  uint32 id = 1;
  int32 part = 2;                // ITEM_PART; -1 = the part its kind goes to (KItemList::GetEquipPlace)
  uint32 seq = 3;
}

message ItemUnequipReq {         // C2G_ITEM_UNEQUIP
  uint32 part = 1;
  uint32 seq = 2;
}

message ItemUseReq {             // C2G_ITEM_USE
  uint32 id = 1;
  uint32 seq = 2;
}

message ItemDropReq {            // C2G_ITEM_DROP
  uint32 id = 1;
  uint32 seq = 2;
}

message ItemResult {             // G2C_ITEM_RESULT: the request changed nothing
  uint32 seq = 1;
  Result result = 2;
}

message MoneySync {              // G2C_MONEY
  uint32 money = 1;
  uint32 bank_money = 2;
}

// The player was moved to another map (KNpc::ChangeWorld across subworlds on the old server).
// The client drops every entity, loads the bundle and waits for the EntitySpawn of the new
// surroundings (which includes the player itself).
message ChangeMap {
  uint32 map_id = 1;
  Vec2 pos = 2;
  uint32 scene_w = 3;
  uint32 scene_h = 4;
  uint64 entity_id = 5;          // the player's entity in the new map
}

message ChatMsg {
  uint64 entity_id = 1;
  string name = 2;
  string text = 3;
}

message Ping {
  uint64 client_ms = 1;
}

message Pong {
  uint64 client_ms = 1;
  uint64 server_ms = 2;
  uint64 tick = 3;
}

message Kick {
  Result reason = 1;
  string text = 2;
}

// ---- common.proto ----
// Shared scalar types.  Package jx.pb is used by every file so the three generators
// (C++ jx::pb, Go jxpb, GDScript) see one namespace.

// World position in integer units (old game: 1 cell = 32 units, one map ~ 10k x 10k units).
message Vec2 {
  int32 x = 1;
  int32 y = 2;
}

enum Result {
  RESULT_OK = 0;
  RESULT_INTERNAL_ERROR = 1;
  RESULT_BAD_REQUEST = 2;
  RESULT_UNAUTHORIZED = 3;
  RESULT_NOT_FOUND = 4;
  RESULT_ALREADY_EXISTS = 5;
  RESULT_FULL = 6;
  RESULT_INVALID_NAME = 7;
  RESULT_WRONG_STATE = 8;
  RESULT_ZONE_UNAVAILABLE = 9;
  RESULT_VERSION_MISMATCH = 10;
  // login results of the old Sword3PaySys / Bishop (LoginDef.h LOGIN_R_*, S3PAccount::Login)
  RESULT_ACCOUNT_IN_USE = 11;    // LOGIN_R_ACCOUNT_EXIST: the account is logged in elsewhere
  RESULT_ACCOUNT_FROZEN = 12;    // LOGIN_R_FREEZE: frozen by a GM
  RESULT_NO_GAME_TIME = 13;      // LOGIN_R_TIMEOUT / E_ACCOUNT_NODEPOSIT: no game time left
  RESULT_SERVER_BUSY = 14;       // LOGIN_R_FAILED: too many failed logins, try again later
  // session protection (new in JX NEXT)
  RESULT_RATE_LIMITED = 15;      // the client sent more than the gateway allows
  RESULT_TIMEOUT = 16;           // no heartbeat within the allowed time
  RESULT_REPLACED = 17;          // LOGIN_R_BEDISCONNECTED: the account logged in from elsewhere
  RESULT_SERVER_SHUTDOWN = 18;   // LL_R_SERVER_SHUTDOWN: the gateway is going down
}

enum EntityType {
  ENTITY_UNKNOWN = 0;
  ENTITY_PLAYER = 1;
  ENTITY_NPC = 2;
  ENTITY_MONSTER = 3;
  ENTITY_DROP = 4;
}

// ---- internal.proto ----
// Gateway <-> zone messages (never sent to clients).


message ZoneHello {
  uint32 protocol_version = 1;
  string gateway_id = 2;
}

message ZoneHelloAck {
  uint32 protocol_version = 1;
  uint32 zone_id = 2;
  string zone_name = 3;
  uint32 tick_hz = 4;
  uint32 capacity = 5;
  uint32 map_id = 6;             // asset bundle id (client/assets/maps/<map_id>), 0 = no map
  uint32 scene_w = 7;            // map size in scene units
  uint32 scene_h = 8;
  // The high bits every session id of this gateway must carry.  A zone in front of several
  // gateways would otherwise see session 1 of each of them as the same session: the second one
  // silently replaced the first, and half the players never reached the world.  The zone hands
  // out one prefix per gateway link.
  uint64 session_prefix = 9;
}

// Gateway asks the zone to spawn a player for a client session.
message SessionOpen {
  uint64 sid = 1;
  uint64 account_id = 2;
  RoleData role = 3;
}

message SessionOpenAck {
  uint64 sid = 1;
  Result result = 2;
  uint64 entity_id = 3;
  Vec2 pos = 4;
  uint32 map_id = 5;             // the map the player spawned in (a zone hosts several)
  uint32 scene_w = 6;
  uint32 scene_h = 7;
}

message SessionClose {
  uint64 sid = 1;
  uint32 reason = 2;             // 0 = client left, 1 = timeout, 2 = kicked, 3 = gateway shutdown
}

// A client message forwarded to the zone verbatim.
message ClientPacket {
  uint64 sid = 1;
  uint32 msg_id = 2;
  bytes payload = 3;
}

// A message from the zone to one or many client sessions (fan-out done by the gateway).
message ZonePacket {
  repeated uint64 sids = 1;
  uint32 msg_id = 2;
  bytes payload = 3;
}

// Zone -> gateway: persist the player (periodic and on SessionClose).
message PlayerSave {
  uint64 sid = 1;
  RoleData role = 2;
  bool final = 3;                // true when the player has left the zone
  uint64 tick = 4;               // the zone tick the snapshot was taken at (saves are spread over ticks)
}

message ZoneStats {
  uint32 zone_id = 1;
  uint64 tick = 2;
  uint32 players = 3;
  uint32 entities = 4;
  uint32 tick_ms_avg = 5;
  uint32 tick_ms_max = 6;
}

// ---- msg.proto ----
// Message id registry.  Every frame on the wire carries one of these ids (see docs/PROTOCOL.md).
//   1000-1999  C2G   client -> gateway
//   2000-2999  G2C   gateway -> client
//   9000-9999  internal gateway <-> zone
// Never reuse a number.  Ids marked (zone) are forwarded by the gateway to the zone as ClientPacket.

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_VERSION = 1;
}

enum MsgId {
  MSG_NONE = 0;

  // client -> gateway
  C2G_HELLO = 1001;
  C2G_LOGIN = 1002;
  C2G_CHAR_LIST = 1003;
  C2G_CHAR_CREATE = 1004;
  C2G_ENTER_WORLD = 1005;
  C2G_LEAVE_WORLD = 1006;
  C2G_PING = 1007;
  C2G_MOVE = 1101;             // (zone)
  C2G_CHAT = 1102;             // (zone)
  C2G_ATTACK = 1103;           // (zone)
  C2G_ITEM_MOVE = 1104;        // (zone) an item to another cell / room
  C2G_ITEM_EQUIP = 1105;       // (zone) wear an item from the bag
  C2G_ITEM_UNEQUIP = 1106;     // (zone) take a worn item off into the bag
  C2G_ITEM_USE = 1107;         // (zone) eat a medicine / use an item
  C2G_ITEM_DROP = 1108;        // (zone) throw an item away: it lies on the ground for a while
  C2G_PICK_UP = 1109;          // (zone) pick up an item / money from the ground

  // gateway -> client
  G2C_HELLO_ACK = 2001;
  G2C_LOGIN_RES = 2002;
  G2C_CHAR_LIST_RES = 2003;
  G2C_CHAR_CREATE_RES = 2004;
  G2C_ENTER_WORLD_RES = 2005;
  G2C_PONG = 2007;
  G2C_KICK = 2008;
  G2C_ENTITY_SPAWN = 2101;
  G2C_ENTITY_DESPAWN = 2102;
  G2C_ENTITY_MOVE = 2103;
  G2C_CHAT_MSG = 2104;
  G2C_ENTITY_ACTION = 2105;    // attack / hurt / death / revive (old NPC_HURT_SYNC, NPC_DEATH_SYNC, skill sync)
  G2C_ENTITY_LIFE = 2106;
  G2C_CHANGE_MAP = 2107;       // the zone moved the player to another map (NewWorld of a trap script)
  G2C_ENTITY_MOVES = 2108;     // several EntityMove in one frame: what moved far from the receiver, every few ticks (N3)
  G2C_ITEM_LIST = 2109;        // everything the character carries, on entering the world
  G2C_ITEM_ADD = 2110;         // a new item, or a stack that changed (same id, new count)
  G2C_ITEM_REMOVE = 2111;      // an item is gone (used up, dropped)
  G2C_ITEM_MOVE = 2112;        // an item lies somewhere else now (also the answer to C2G_ITEM_MOVE / EQUIP / UNEQUIP)
  G2C_ITEM_RESULT = 2113;      // a request that changed nothing, with why
  G2C_MONEY = 2114;            // money in the bag and the repository

  // gateway <-> zone
  GZ_ZONE_HELLO = 9001;
  ZG_ZONE_HELLO_ACK = 9002;
  GZ_SESSION_OPEN = 9003;
  ZG_SESSION_OPEN_ACK = 9004;
  GZ_SESSION_CLOSE = 9005;
  GZ_CLIENT_PACKET = 9006;
  ZG_ZONE_PACKET = 9007;
  ZG_PLAYER_SAVE = 9008;
  ZG_ZONE_STATS = 9009;
}

// ---- role.proto ----
// Persistent character data ("RoleData").  This is the model every layer agrees on:
// persist stores it, the zone loads/saves it, the client receives a projection of it.
// Add fields freely; never renumber or reuse a tag.


message RolePosition {
  uint32 zone_id = 1;   // logical zone id
  Vec2 pos = 2;
  uint32 map_id = 3;    // map bundle within the zone (0 = the zone's default map)
}

message RoleStats {
  int32 hp = 1;
  int32 hp_max = 2;
  int32 mp = 3;
  int32 mp_max = 4;
  int32 stamina = 5;
  int32 stamina_max = 6;
  int32 strength = 7;
  int32 dexterity = 8;
  int32 vitality = 9;
  int32 energy = 10;
  int32 move_speed = 11;    // units per second
}

// One attribute of an item (KMagicAttrib of the old core): a type and up to three parameters.
message ItemMagic {
  uint32 type = 1;
  repeated int32 value = 2;   // 3 values
}

// One item a character holds (KItem + its place in KItemList; docs/OLD-TO-NEW.md).  What made
// the item is kept (version, genre/detail/particular/level, gen_param) so its table row can be
// found again, and what was rolled for it (base attributes, magic) so it never re-rolls.
message ItemData {
  uint32 id = 1;              // unique within the character, never reused
  uint32 version = 2;         // the item table set it was made from (settings/item/000..)
  uint32 genre = 3;           // ITEMGENRE
  uint32 detail = 4;
  uint32 particular = 5;
  uint32 level = 6;
  int32 series = 7;           // -1 = none
  uint32 count = 8;           // stack
  int32 durability = 9;       // -1 = never wears
  uint32 ex_type = 10;        // 0 normal, 1 gold, 2 platina, 3 purple
  uint32 gen_param = 11;      // gold: row id; script item: row
  uint32 group = 12;          // gold: the set
  uint32 ex_group = 13;
  uint32 group_serial = 14;
  repeated ItemMagic base = 15;
  repeated ItemMagic require = 16;
  repeated ItemMagic magic = 17;
  repeated ItemMagic magic_ex = 18;
  uint32 room = 19;           // KItemRoom: 0 bag, 1 repository, 2 trade, 3 quick slots, 10 worn (x = part)
  uint32 x = 20;
  uint32 y = 21;
}

message RoleData {
  uint64 player_id = 1;
  uint64 account_id = 2;
  string name = 3;          // UTF-8, validated by the auth/persist layer
  uint32 level = 4;
  uint64 exp = 5;
  uint32 series = 6;        // five elements (metal, wood, water, fire, earth) as in the old game
  uint32 sex = 7;
  uint32 faction = 8;
  RolePosition position = 9;
  RoleStats stats = 10;
  repeated ItemData items = 11;   // (RoleItem, the placeholder that stood here, was never written by anyone)
  uint64 created_at_ms = 12;
  uint64 last_login_ms = 13;
  uint64 play_time_s = 14;
  // Shape of this record.  persist.CurrentRoleVersion is what the running server writes; an
  // older record is upgraded on load (persist.MigrateRole), a newer one is refused instead of
  // being silently downgraded.  See docs/ADR-003-role-data.md.
  uint32 data_version = 15;
  bool fight_mode = 16;     // KNpc::SetFightMode: in/out of combat stance (city gate traps)
  // Where the character was born (CharCreateReq.native_place, KRoleChiefInfo.NativePlaceId of the
  // old game): the map id of the starting village, the character's home for the revive rules.
  uint32 native_place = 17;
  uint32 next_item_id = 18;  // KItemList: the id the next item gets (ids never repeat within a character)
  uint32 money = 19;         // in the bag (KItemList room_equipment money)
  uint32 bank_money = 20;    // in the repository
}

